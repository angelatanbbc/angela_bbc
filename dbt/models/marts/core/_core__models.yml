version: 2

models:
  - name: dim_app_type
    description: App type dimension used by Piano audience and subscription facts.
    columns:
      - name: app_type_id
        description: Stable hash identifier for the app type.
        tests:
          - not_null
          - unique
      - name: app_type
        description: Normalised app type label.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Web", "Mobile App", "Other", "Unknown"]

  - name: dim_device_type
    description: Device type dimension used by Piano audience and subscription facts.
    columns:
      - name: device_type_id
        description: Stable hash identifier for the device type.
        tests:
          - not_null
          - unique
      - name: device_type
        description: Normalised device type label.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  ["Mobile Phone", "Desktop", "Tablet", "Other", "Unknown"]

  - name: dim_date
    description: Date dimension used by Piano audience and subscription facts.
    columns:
      - name: date_key
        description: Unique identifier for each date.
        tests:
          - not_null
          - unique
      - name: date_day
        description: The day of the month.
        tests:
          - not_null
          - unique
      - name: date_id
        description: Unique identifier for each date.
        tests:
          - not_null
          - unique
      - name: day_of_month
        description: The day of the month.
        tests:
          - not_null
      - name: day_of_year
        description: The day of the year.
        tests:
          - not_null
      - name: day_of_week
        description: The day of the week.
        tests:
          - not_null
      - name: day_name
        description: The name of the day of the week.
        tests:
          - not_null
      - name: day_name_short
        description: The short name of the day of the week.
        tests:
          - not_null
      - name: day_end_timestamp
        description: The timestamp for the end of the day.
        tests:
          - not_null
      - name: week_of_year
        description: The week of the year.
        tests:
          - not_null
      - name: week_start_date
        description: The date for the start of the week.
        tests:
          - not_null
      - name: week_end_date
        description: The date for the end of the week.
        tests:
          - not_null
      - name: month_of_year
        description: The month of the year.
        tests:
          - not_null
      - name: month_name
        description: The name of the month.
        tests:
          - not_null
      - name: month_name_short
        description: The short name of the month.
        tests:
          - not_null
      - name: month_start_date
        description: The date for the start of the month.
        tests:
          - not_null
      - name: month_end_date
        description: The date for the end of the month.
        tests:
          - not_null
      - name: quarter_of_year
        description: The quarter of the year.
        tests:
          - not_null
      - name: quarter_name
        description: The name of the quarter.
        tests:
          - not_null
      - name: quarter_start_date
        description: The date for the start of the quarter.
        tests:
          - not_null
      - name: quarter_end_date
        description: The date for the end of the quarter.
        tests:
          - not_null
      - name: year
        description: The year.
        tests:
          - not_null
      - name: year_start_date
        description: The date for the start of the year.
        tests:
          - not_null
      - name: year_end_date
        description: The date for the end of the year.
        tests:
          - not_null
      - name: year_month
        description: The year and month.
        tests:
          - not_null
      - name: fiscal_year
        description: The fiscal year.
        tests:
          - not_null
      - name: fiscal_quarter
        description: The fiscal quarter.
        tests:
          - not_null
      - name: is_weekend
        description: Indicates whether the date is a weekend.
        tests:
          - not_null
      - name: is_weekday
        description: Indicates whether the date is a weekday.
        tests:
          - not_null
      - name: is_first_day_of_month
        description: Indicates whether the date is the first day of the month.
        tests:
          - not_null
      - name: is_last_day_of_month
        description: Indicates whether the date is the last day of the month.
        tests:
          - not_null
      - name: is_first_day_of_quarter
        description: Indicates whether the date is the first day of the quarter.
        tests:
          - not_null
      - name: is_last_day_of_quarter
        description: Indicates whether the date is the last day of the quarter.
        tests:
          - not_null
      - name: is_today
        description: Indicates whether the date is today.
        tests:
          - not_null
      - name: is_yesterday
        description: Indicates whether the date is yesterday.
        tests:
          - not_null
      - name: is_current_week
        description: Indicates whether the date is the current week.
        tests:
          - not_null
      - name: is_current_month
        description: Indicates whether the date is the current month.
        tests:
          - not_null
      - name: is_current_quarter
        description: Indicates whether the date is the current quarter.
        tests:
          - not_null
      - name: is_current_year
        description: Indicates whether the date is the current year.
        tests:
          - not_null
      - name: days_from_today
        description: The number of days from the current date.
        tests:
          - not_null

  - name: dim_geography
    description: Geography dimension covering known US/Canada country-region combinations plus a dedicated Unknown row, used by Piano audience and subscription facts.
    columns:
      - name: geo_id
        description: Stable hash identifier for the geo_country/geo_region combination.
        tests:
          - not_null
          - unique
      - name: geo_country
        description: Normalised country label.
        tests:
          - not_null
      - name: geo_region
        description: Normalised region/state label. 'Unknown' when the source event had a known country but no region, or when the country itself was unknown.
        tests:
          - not_null

  - name: dim_os_group
    description: Operating system group dimension used by Piano audience and subscription facts.
    columns:
      - name: os_group_id
        description: Stable hash identifier for the operating system group.
        tests:
          - not_null
          - unique
      - name: os_group
        description: Normalised operating system group label.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  [
                    "iOS",
                    "macOS",
                    "Windows",
                    "Linux",
                    "Android",
                    "Chrome OS",
                    "Other",
                    "Unknown",
                  ]
