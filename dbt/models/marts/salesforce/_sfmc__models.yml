version: 2

models:
  - name: sfmc_journey_send_job
    description: Aggregated SFMC journey send job performance with send, open, click, bounce and unsubscribe metrics.
    columns:
      - name: SendID
        description: Unique send identifier used to join email activity metrics and journey metadata.
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: source('sfmc','sent')
                field: send_id
      - name: EmailName
        description: Email name from the send job metadata.
      - name: EmailSubject
        description: Email subject line from the send job metadata.
      - name: EventDate
        description: Date of the send event, derived from the SFMC sent events.
      - name: Year
        description: Year extracted from the send event date.
      - name: ListID
        description: Identifier for the list used by the send.
        tests:
          - not_null
      - name: ListName
        description: Normalised list name for the send.
      - name: Sent
        description: Count of email records sent for the triggered send.
      - name: Delivered
        description: Count of delivered emails after excluding unique bounces.
      - name: UniqueOpens
        description: Count of unique email opens for the send.
      - name: TotalOpens
        description: Total email open events for the send.
      - name: UniqueClicks
        description: Count of unique email clicks for the send.
      - name: TotalClicks
        description: Total email click events for the send.
      - name: UniqueBounces
        description: Count of unique bounce events for the send.
      - name: TotalBounces
        description: Total bounce events for the send.
      - name: Unsubscribes
        description: Count of unique unsubscribe events for the send.
      - name: OpenRate
        description: Unique open rate for the send.
      - name: ClickRate
        description: Unique click rate for the send.
      - name: ClickToOpen
        description: Click-to-open rate for the send.
      - name: BounceRate
        description: Unique bounce rate for the send.
      - name: UnsubscribeRate
        description: Unique unsubscribe rate for the send.
      - name: JourneyName
        description: Journey name associated with the send.
      - name: ActivityName
        description: Journey activity name associated with the send.
