version: 2

models:
  - name: dim_app_type
    description: App type dimension used by Piano audience and subscription facts.
    columns:
      - name: app_type_id
        description: Stable hash identifier for the app type.
        tests:
          - not_null
          - unique
      - name: app_type
        description: Normalised app type label.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Web", "Mobile App", "Other", "Unknown"]

  - name: dim_device_type
    description: Device type dimension used by Piano audience and subscription facts.
    columns:
      - name: device_type_id
        description: Stable hash identifier for the device type.
        tests:
          - not_null
          - unique
      - name: device_type
        description: Normalised device type label.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  ["Mobile Phone", "Desktop", "Tablet", "Other", "Unknown"]

  - name: dim_date
    description: Date dimension used by Piano audience and subscription facts.
    columns:
      - name: date_key
        description: Unique identifier for each date.
        tests:
          - not_null
          - unique
      - name: date_day
        description: The day of the month.
        tests:
          - not_null
          - unique
      - name: date_id
        description: Unique identifier for each date.
        tests:
          - not_null
          - unique
      - name: day_of_month
        description: The day of the month.
        tests:
          - not_null
      - name: day_of_year
        description: The day of the year.
        tests:
          - not_null
      - name: day_of_week
        description: The day of the week.
        tests:
          - not_null
      - name: day_name
        description: The name of the day of the week.
        tests:
          - not_null
      - name: day_name_short
        description: The short name of the day of the week.
        tests:
          - not_null
      - name: day_end_timestamp
        description: The timestamp for the end of the day.
        tests:
          - not_null
      - name: week_of_year
        description: The week of the year.
        tests:
          - not_null
      - name: week_start_date
        description: The date for the start of the week.
        tests:
          - not_null
      - name: week_end_date
        description: The date for the end of the week.
        tests:
          - not_null
      - name: month_of_year
        description: The month of the year.
        tests:
          - not_null
      - name: month_name
        description: The name of the month.
        tests:
          - not_null
      - name: month_name_short
        description: The short name of the month.
        tests:
          - not_null
      - name: month_start_date
        description: The date for the start of the month.
        tests:
          - not_null
      - name: month_end_date
        description: The date for the end of the month.
        tests:
          - not_null
      - name: quarter_of_year
        description: The quarter of the year.
        tests:
          - not_null
      - name: quarter_name
        description: The name of the quarter.
        tests:
          - not_null
      - name: quarter_start_date
        description: The date for the start of the quarter.
        tests:
          - not_null
      - name: quarter_end_date
        description: The date for the end of the quarter.
        tests:
          - not_null
      - name: year
        description: The year.
        tests:
          - not_null
      - name: year_start_date
        description: The date for the start of the year.
        tests:
          - not_null
      - name: year_end_date
        description: The date for the end of the year.
        tests:
          - not_null
      - name: year_month
        description: The year and month.
        tests:
          - not_null
      - name: fiscal_year
        description: The fiscal year.
        tests:
          - not_null
      - name: fiscal_quarter
        description: The fiscal quarter.
        tests:
          - not_null
      - name: is_weekend
        description: Indicates whether the date is a weekend.
        tests:
          - not_null
      - name: is_weekday
        description: Indicates whether the date is a weekday.
        tests:
          - not_null
      - name: is_first_day_of_month
        description: Indicates whether the date is the first day of the month.
        tests:
          - not_null
      - name: is_last_day_of_month
        description: Indicates whether the date is the last day of the month.
        tests:
          - not_null
      - name: is_first_day_of_quarter
        description: Indicates whether the date is the first day of the quarter.
        tests:
          - not_null
      - name: is_last_day_of_quarter
        description: Indicates whether the date is the last day of the quarter.
        tests:
          - not_null
      - name: is_today
        description: Indicates whether the date is today.
        tests:
          - not_null
      - name: is_yesterday
        description: Indicates whether the date is yesterday.
        tests:
          - not_null
      - name: is_current_week
        description: Indicates whether the date is the current week.
        tests:
          - not_null
      - name: is_current_month
        description: Indicates whether the date is the current month.
        tests:
          - not_null
      - name: is_current_quarter
        description: Indicates whether the date is the current quarter.
        tests:
          - not_null
      - name: is_current_year
        description: Indicates whether the date is the current year.
        tests:
          - not_null
      - name: days_from_today
        description: The number of days from the current date.
        tests:
          - not_null

  - name: dim_geography
    description: Geography dimension covering known US/Canada country-region combinations plus a dedicated Unknown row, used by Piano audience and subscription facts.
    columns:
      - name: geo_id
        description: Stable hash identifier for the geo_country/geo_region combination.
        tests:
          - not_null
          - unique
      - name: geo_country
        description: Normalised country label.
        tests:
          - not_null
      - name: geo_region
        description: Normalised region/state label. 'Unknown' when the source event had a known country but no region, or when the country itself was unknown.
        tests:
          - not_null

  - name: dim_os_group
    description: Operating system group dimension used by Piano audience and subscription facts.
    columns:
      - name: os_group_id
        description: Stable hash identifier for the operating system group.
        tests:
          - not_null
          - unique
      - name: os_group
        description: Normalised operating system group label.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  [
                    "iOS",
                    "macOS",
                    "Windows",
                    "Linux",
                    "Android",
                    "Chrome OS",
                    "Other",
                    "Unknown",
                  ]

  - name: dim_experience
    description: >
      Composer experiences. One row per experience, with its latest state in the Piano API snapshots: the nightly
      list, plus archived experiences backfilled by id (the list leaves archived experiences out).
    columns:
      - name: experience_id
        description: Identifier for the Composer experience.
        tests:
          - not_null
          - unique
      - name: experience_name
        description: Experience title in Piano.
        tests:
          - not_null
      - name: app_type_id
        description: >
          App type of the experience, from Piano's experience type: site and template-interaction are Web, mobile
          is Mobile App, and any other type is Unknown.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_app_type')
                field: app_type_id
      - name: experience_description
        description: Description entered in Piano.
      - name: experience_type
        description: Piano experience type (site, mobile or template-interaction).
      - name: experience_status
        description: Piano experience status at the latest snapshot, such as LIVE, OFFLINE, SCHEDULED or ARCHIVED.
      - name: is_deleted
        description: Whether the experience is deleted in Piano (archived, for experiences backfilled by id).
        tests:
          - not_null
      - name: is_listed_in_piano
        description: Whether the experience is in the latest nightly Piano list. False once it is archived or deleted in Piano.
        tests:
          - not_null
      - name: created_at
        description: When the experience was created in Piano.
      - name: updated_at
        description: When the experience was last updated in Piano.

  - name: dim_template
    description: >
      Piano offer templates. One row per template, with its latest state in the Piano API snapshots: the nightly
      list (which includes archived templates), plus system templates backfilled by id, such as the default offer.
    columns:
      - name: template_id
        description: Unique identifier for the offer template.
        tests:
          - not_null
          - unique
      - name: template_name
        description: Template name in Piano.
        tests:
          - not_null
      - name: template_type
        description: Classification from the template name (Paywall, Ribbon, Subscription Landing Page or Other).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Paywall", "Ribbon", "Subscription Landing Page", "Other"]
      - name: template_description
        description: Description entered in Piano.
      - name: template_piano_type_id
        description: Piano's template type, such as template or default_offer.
      - name: template_category_id
        description: Piano's template category, such as paywall or churn_prevention.
      - name: template_status
        description: Piano template status, active or archived.
      - name: is_published
        description: Whether the template is published.
      - name: is_deleted
        description: Whether Piano marked the template as deleted. Archived templates are not deleted; see template_status.
        tests:
          - not_null
      - name: is_listed_in_piano
        description: Whether the template is in the latest nightly Piano list.
        tests:
          - not_null
      - name: created_at
        description: Timestamp when the template was created.
      - name: updated_at
        description: Timestamp when the template was last updated.
      - name: archived_at
        description: Timestamp when the template was archived; null unless archived.

  - name: dim_term
    description: >
      Piano terms (the plans a subscription is bought on). One row per term, with its latest state in the Piano API
      snapshots. Offers are linked through dim_offer_term, since a term can be sold through several offers.
    columns:
      - name: term_id
        description: Unique identifier for the subscription term.
        tests:
          - not_null
          - unique
      - name: term_name
        description: Term name in Piano.
        tests:
          - not_null
      - name: term_description
        description: Description entered in Piano.
      - name: term_type
        description: Piano term type, such as payment, external (app store), registration or grant_access.
      - name: resource_id
        description: Piano resource (rid) the term grants access to.
      - name: resource_name
        description: Name of the Piano resource.
      - name: billing_period
        description: >
          Renewal period, such as 1 month or 1 year, from the term's recurring billing step in Piano. App store terms
          have no billing plan in Piano, so theirs comes from the app_store_term_billing_period seed.
        tests:
          - not_null:
              config:
                where: "term_type IN ('payment', 'external')"
      - name: billing_plan_description
        description: Human-readable billing plan from Piano, for example $8.99 per month.
      - name: currency_code
        description: Currency of the term's prices.
      - name: first_price_amount
        description: Price of the first billing period, in currency_code. Lower than recurring_price_amount for introductory offers.
      - name: recurring_price_amount
        description: Price the term renews at, in currency_code.
      - name: is_subscription
        description: Whether the term is a recurring subscription.
      - name: has_free_trial
        description: Whether the term has a free trial.
      - name: is_trial_new_customers_only
        description: Whether the trial or introductory price is restricted to new customers.
      - name: external_api_name
        description: App store integration for external terms.
      - name: is_listed_in_piano
        description: Whether the term is in the latest nightly Piano list.
        tests:
          - not_null
      - name: created_at
        description: Timestamp when the term was created.
      - name: updated_at
        description: Timestamp when the term was last updated.

  - name: dim_offer
    description: Piano offers. One row per offer ever listed by the Piano API, with its latest state.
    columns:
      - name: offer_id
        description: Piano identifier for the offer.
        tests:
          - not_null
          - unique
      - name: offer_name
        description: Offer name in Piano.
        tests:
          - not_null
      - name: offer_status
        description: Piano offer status.
      - name: term_count
        description: Number of terms the offer sold at its latest snapshot.
        tests:
          - not_null
      - name: is_deleted
        description: Whether Piano marked the offer as deleted.
        tests:
          - not_null
      - name: is_listed_in_piano
        description: Whether the offer is in the latest Piano API snapshot.
        tests:
          - not_null
      - name: created_at
        description: When the offer was created in Piano.
      - name: updated_at
        description: When the offer was last updated in Piano.

  - name: dim_offer_term
    description: >
      Bridge between offers and the terms they sell. One row per offer and term ever linked in the Piano API.
      A term can be sold through several offers, and an offer sells several terms.
    columns:
      - name: offer_term_id
        description: Hash of offer_id and term_id.
        tests:
          - not_null
          - unique
      - name: offer_id
        description: Piano offer identifier.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_offer')
                field: offer_id
      - name: term_id
        description: Piano term identifier.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_term')
                field: term_id
      - name: first_listed_date
        description: First snapshot date the link was listed.
        tests:
          - not_null
      - name: last_listed_date
        description: Latest snapshot date the link was listed.
        tests:
          - not_null
      - name: is_listed_in_piano
        description: Whether the offer still sells the term at the latest snapshot.
        tests:
          - not_null

  - name: dim_subscription
    description: Type 1 dimension at the grain of one row per subscription, focused on subscription lifecycle, status and term state.
    columns:
      - name: subscription_id
        description: Piano identifier for the subscription.
        tests:
          - not_null
          - unique
      - name: user_id
        description: Piano identifier for the registered user/account linked to the subscription and behavioural facts.
      - name: user_first_party_id
        description: Alternative first-party identifier for the registered user/account linked to the subscription.
        tests:
          - not_null
      - name: conversion_id
        description: Piano identifier for the conversion event that created the subscription.
        tests:
          - not_null:
              config:
                severity: warn
      - name: subscription_sequence_number
        description: The order of this subscription within the user's observed subscription history.
        tests:
          - not_null
      - name: subscription_start_type
        description: Classification of how the subscription began for the user.
      - name: subscription_end_type
        description: Classification of how the subscription ended; null when the subscription is active.
      - name: is_active
        description: Whether the subscription is currently active.
        tests:
          - not_null
      - name: subscription_started_at
        description: Timestamp of the first observed event for the subscription.
        tests:
          - not_null
      - name: subscription_ended_at
        description: Timestamp when the subscription ended, if inactive.
      - name: latest_action_at
        description: Timestamp of the latest observed subscription event.
        tests:
          - not_null:
              config:
                severity: warn
      - name: latest_action
        description: Latest observed subscription action or event type.
        tests:
          - not_null:
              config:
                severity: warn
      - name: created_via_upgrade
        description: Whether the subscription was created by an explicit upgrade flow.
        tests:
          - not_null
      - name: is_ended_by_upgrade
        description: Whether the next subscription for the same user explicitly started via upgrade from this subscription.
        tests:
          - not_null
      - name: ended_by_upgrade_subscription_id
        description: Subscription ID that superseded this subscription through an upgrade, when applicable.
      - name: ended_by_upgrade_conversion_id
        description: Conversion ID that created the upgrade subscription, when applicable.
      - name: term_id
        description: Term ID attached to the subscription.
      - name: term_name
        description: Term name attached to the subscription.
      - name: billing_plan
        description: Billing plan attached to the subscription.
      - name: subscription_period_number
        description: Latest observed subscription period number.
      - name: mrr_amount
        description: Current MRR amount for the subscription, set to zero when superseded by an upgrade.
        tests:
          - not_null
