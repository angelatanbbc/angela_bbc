version: 2

models:
  - name: fct_visitors_daily
    description: >
      Daily visitor fact table at the grain of one row per visitor, date, site and device
      platform (app type, device type and operating system group, see dim_device_platform).
      geo_id is the visitor's modal geography for the day and is not part of the grain. Incremental runs delete and rebuild every date
      from the day before the latest loaded date_key.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - date_key
              - site_id
              - device_platform_id
              - visitor_id
          config:
            # Warn until tables built before the delete+insert fix have been fully refreshed
            severity: warn
    columns:
      - name: visitor_date_key
        description: Surrogate key of date, site, geography, device platform and visitor. Unique per row; geo_id is the modal geography, so the key is not stable across runs if that changes.
        tests:
          - not_null
          - unique
      - name: date_key
        description: Date of the visitor activity.
        tests:
          - not_null
      - name: site_id
        description: Surrogate key for the site associated with the visitor activity.
        tests:
          - not_null
      - name: device_platform_id
        description: Device platform (app type, device type and operating system group) of the visitor activity.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_device_platform')
                field: device_platform_id
      - name: geo_id
        description: Geographic identifier for the visitor's modal country and region on the date (the geography with the most page views).
        tests:
          - not_null
      - name: visitor_id
        description: Piano unique identifier for the visitor.
        tests:
          - not_null
      - name: n_visits
        description: Number of distinct Piano visits for the visitor on the date and dimensional grain.
        tests:
          - not_null
      - name: n_pageviews
        description: Number of Piano page display events for the visitor on the date and dimensional grain.
        tests:
          - not_null

  - name: fct_sfmc_journey_send_job
    description: Aggregated SFMC journey send job performance with send, open, click, bounce and unsubscribe metrics.
    columns:
      - name: SendID
        description: Unique send identifier used to join email activity metrics and journey metadata.
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('sfmc','sent')
                field: send_id
      - name: EmailName
        description: Email name from the send job metadata.
      - name: EmailSubject
        description: Email subject line from the send job metadata.
      - name: EventDate
        description: Date of the send event, derived from the SFMC sent events.
      - name: Year
        description: Year extracted from the send event date.
      - name: ListID
        description: Identifier for the list used by the send.
        tests:
          - not_null
      - name: ListName
        description: Normalised list name for the send.
      - name: Sent
        description: Count of email records sent for the triggered send.
      - name: Delivered
        description: Count of delivered emails after excluding unique bounces.
      - name: UniqueOpens
        description: Count of unique email opens for the send.
      - name: TotalOpens
        description: Total email open events for the send.
      - name: UniqueClicks
        description: Count of unique email clicks for the send.
      - name: TotalClicks
        description: Total email click events for the send.
      - name: UniqueBounces
        description: Count of unique bounce events for the send.
      - name: TotalBounces
        description: Total bounce events for the send.
      - name: Unsubscribes
        description: Count of unique unsubscribe events for the send.
      - name: OpenRate
        description: Unique open rate for the send.
      - name: ClickRate
        description: Unique click rate for the send.
      - name: ClickToOpen
        description: Click-to-open rate for the send.
      - name: BounceRate
        description: Unique bounce rate for the send.
      - name: UnsubscribeRate
        description: Unique unsubscribe rate for the send.
      - name: JourneyName
        description: Journey name associated with the send.
      - name: ActivityName
        description: Journey activity name associated with the send.

  - name: fct_subscriber_activity_daily
    description: Daily subscriber activity fact table at the grain of one row per active subscriber user and date, with visit and pageview measures for subscriber interaction with the site.
    columns:
      - name: subscriber_activity_daily_key
        description: Surrogate key for the subscriber-date grain.
        tests:
          - not_null
          - unique
      - name: date_day
        description: Date of subscriber activity and active subscriber status.
        tests:
          - not_null
      - name: user_first_party_id
        description: Piano unique identifier for the subscribed user.
        tests:
          - not_null:
              config:
                severity: warn
      - name: n_active_subscriptions
        description: Number of active subscriptions held by the user on the date.
        tests:
          - not_null
      - name: mrr_amount
        description: Total active MRR for the user on the date.
        tests:
          - not_null
      - name: n_visits
        description: Number of distinct Piano visits by the subscriber on the date.
        tests:
          - not_null
      - name: n_pageviews
        description: Number of Piano page display events by the subscriber on the date.
        tests:
          - not_null
      - name: is_engaged
        description: Whether the subscriber generated at least one pageview on the date.
        tests:
          - not_null

  - name: fct_conversions
    description: This table contains correctly attributed conversion events with relevant attributes, at the grain of one row per marketing touchpoint.
    columns:
      - name: conversion_id
        description: Piano unique identifier for the conversion event.
        tests:
          - not_null
      - name: subscription_id
        description: Identifier for the subscription associated with the conversion.
        tests:
          - not_null
      - name: visitor_id
        description: Piano unique identifier for the visitor.
        tests:
          - not_null:
              config:
                severity: warn
      - name: user_id
        description: Piano unique identifier for the registered user.
        tests:
          - not_null:
              config:
                severity: warn
      - name: user_first_party_id
        description: First-party user identifier aka FED_ID
      - name: visit_id
        description: Piano unique identifier for the visit associated with the conversion event.
        tests:
          - not_null:
              config:
                severity: warn
      - name: visit_time
        description: Timestamp of the visit associated with the conversion event.
        tests:
          - not_null:
              config:
                severity: warn
      - name: device_platform_id
        description: >
          Device platform (app type, device type and operating system group) of the conversion. App type is
          Web for conversions attributed by the web pipeline and Mobile App for the app pipeline.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_device_platform')
                field: device_platform_id
      - name: conversion_time
        description: Timestamp when the conversion event occurred.
        tests:
          - not_null
      - name: conversion_date
        description: Date when the conversion event occurred.
      - name: term_id
        description: Identifier for the subscription term associated with the conversion.
        tests:
          - not_null
      - name: term_name
        description: Name of the subscription term associated with the conversion.
        tests:
          - not_null
      - name: term_offer_id
        description: Identifier for the subscription term offer associated with the conversion.
      - name: term_offer_name
        description: Name of the subscription term offer associated with the conversion.
      - name: billing_period
        description: Billing period for the subscription (e.g., monthly, annual).
      - name: payment_provider
        description: >
          Where the subscription is billed, observed on the conversion event: Stripe Elements or Braintree Credit
          Card for web checkouts (payment_provider on vx.conversion), Apple App Store or Google Play for app store
          conversions (external_api_source on vx.conversion.offsite). Independent of device_platform_id: a Stripe
          checkout can happen in the app. dim_term.billing_channel gives the term's expected channel.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Stripe Elements", "Braintree Credit Card", "Apple App Store", "Google Play"]
      - name: vx_promo_code
        description: Promo code used during the conversion event, if any.
      - name: cart_turnovertaxfree
        description: >
          Revenue excluding tax at the time of conversion. The value Piano recorded for Stripe and Braintree
          checkouts; for app store conversions an estimate of the list price less the store fee (30% Apple App
          Store, 15% Google Play) keyed on payment_provider.
        tests:
          - not_null
      - name: subscription_period_number
        description: The period number of the subscription at the time of conversion. Always 1 for new subscriptions.
        tests:
          - not_null
      - name: created_via_upgrade
        description: Whether the conversion created this subscription as part of an upgrade flow.
      - name: src
        description: Source through which the visitor came to the site (e.g., email, social, direct).
      - name: src_detail
        description: Detailed source information (e.g., specific campaign name).
      - name: geo_id
        description: Geographic identifier for the visitor's location.
      - name: geo_country
        description: Country of the visitor's location.
      - name: geo_region
        description: Region of the visitor's location.
      - name: geo_city
        description: City of the visitor's location.
      - name: cohort_month
        description: Month when the visitor was part of the cohort.
      - name: experience_id
        description: Identifier for the Composer experience that led to the conversion.
        tests:
          - not_null
      - name: card_id
        description: Identifier for the card used in the Composer experience.
      - name: card_action
        description: Action taken on the card in the Composer experience.
      - name: template_id
        description: Identifier for the template used in the Composer experience.
        tests:
          - not_null
      - name: ab_test_variant_name
        description: A/B test variant name associated with the experience.
      - name: c1x_lts
        description: LtS bucket of the visitor at the time of conversion.
      - name: c1x_content_likely_to_convert
        description: Content Likely to Convert bucket of the viewed content at the time of conversion.
      - name: c1x_likelihood_to_register
        description: Likelihood to Register bucket of the visitor at the time of conversion.
      - name: c1x_likelihood_to_return
        description: Likelihood to Return bucket of the visitor at the time of conversion.
      - name: c1x_revenue_auto_optimization
        description: Revenue Optimization bucket of the page view at the time of conversion.
      - name: attribution_source
        description: Source of attribution for the conversion.
      - name: attribution_source_detail
        description: Detail about the attribution source for the conversion.
      - name: position_weight
        description: Weight assigned to the position of the card in the Composer experience.
      - name: subscription_weight
        description: >
          Number of subscriptions this conversion counts as, from dim_term (2 for group plans, 10 for Business 10, 25
          for Business 25, otherwise 1). Sum it for weighted conversions; multiply by position_weight for weighted
          attributed conversions.
        tests:
          - not_null

  - name: fct_exposures
    description: Exposures to Piano Composer experiences on web and app, at the grain of one row per experience.action event.
    columns:
      - name: exposure_id
        description: Surrogate key for the exposure event (combination of experience_execution_id, experience_id, card_id, template_id and exposure_time).
        tests:
          - not_null
          - unique
      - name: experience_execution_id
        description: Piano unique identifier for the execution of the experience that led to the exposure event.
        tests:
          - not_null
      - name: exposure_time
        description: Timestamp of the exposure event.
        tests:
          - not_null
      - name: exposure_date
        description: Date of the exposure event.
        tests:
          - not_null
      - name: pageview_id
        description: Piano unique identifier for the pageview during which the exposure event occurred.
      - name: visitor_id
        description: Piano unique identifier for the visitor.
        tests:
          - not_null
      - name: visit_id
        description: Piano unique identifier for the visit associated with the exposure event.
        tests:
          - not_null
      - name: user_id
        description: Piano unique identifier for the registered user.
      - name: device_platform_id
        description: >
          Device platform (app type, device type and operating system group) of the exposure. App type is Web
          for web experiences and Mobile App for app experiences, from dim_experience.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_device_platform')
                field: device_platform_id
      - name: page
        description: Page on which the exposure event occurred.
      - name: page_title
        description: Title of the page on which the exposure event occurred.
      - name: page_content_type
        description: Content type of the page on which the exposure event occurred.
      - name: content_type
        description: Piano content type captured on the exposure pageview when available.
      - name: content_id
        description: Identifier for the content on which the exposure event occurred.
      - name: content_section
        description: Editorial section associated with the exposure content when available.
      - name: content_topic
        description: Editorial topic associated with the exposure content when available.
      - name: content_pillar
        description: Editorial pillar associated with the exposure content when available.
      - name: date_published
        description: Publication timestamp associated with the exposure content when available.
      - name: url
        description: URL of the page on which the exposure event occurred.
      - name: geo_id
        description: Geographic identifier for the visitor's location.
      - name: geo_country
        description: Country of the visitor's location.
      - name: geo_region
        description: Region of the visitor's location.
      - name: geo_city
        description: City of the visitor's location.
      - name: experience_id
        description: Identifier for the Composer experience that led to the conversion.
        tests:
          - not_null
      - name: experience_name
        description: Name of the Composer experience that led to the conversion.
      - name: card_id
        description: Identifier for the card used in the Composer experience.
      - name: card_name
        description: Name of the card used in the Composer experience.
      - name: card_action
        description: Action taken on the card (for example showOffer or showTemplate).
      - name: template_id
        description: Identifier for the template used in the Composer experience.
      - name: template_name
        description: Name of the template used in the Composer experience.
      - name: ab_test_card_title
        description: Title of the card used in the A/B test.
      - name: ab_test_variant_name
        description: A/B test variant name associated with the experience.
      - name: c1x_lts
        description: C1X LTS value for the exposure event.
      - name: c1x_content_likely_to_convert
        description: C1X content likely to convert value for the exposure event.
      - name: c1x_likelihood_to_register
        description: C1X likely to return value for the exposure event.
      - name: c1x_likelihood_to_return
        description: C1X likelihood to return value for the exposure event.
      - name: c1x_revenue_auto_optimization
        description: C1X revenue auto-optimization value for the exposure event.

  - name: fct_subscriber_daily_snapshot
    description: Daily snapshot of subscriber state and engagement behavior at the user-day grain.
    columns:
      - name: date_day
        description: Snapshot date.
        tests:
          - not_null
      - name: user_id
        description: Piano unique identifier for the subscribed user.
        tests:
          - not_null:
              config: 
                severity: warn
      - name: subscription_id
        description: Unique identifier for the subscription.
        tests:
          - not_null
      - name: conversion_device_platform_id
        description: Device platform (app type, device type and operating system group) of the conversion that created the subscription.
      - name: conversion_payment_provider
        description: >
          Billing channel of the conversion that created the subscription, from fct_conversions.payment_provider:
          Stripe Elements or Braintree Credit Card for web checkouts, Apple App Store or Google Play for app store
          subscriptions. Independent of conversion_device_platform_id: a Stripe checkout can happen in the app.
          Carried from the subscription's events.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Stripe Elements", "Braintree Credit Card", "Apple App Store", "Google Play"]
      - name: last_subscription_action
        description: Latest observed subscription action or event type.
        tests:
          - not_null
      - name: term_id
        description: Term ID attached to the subscription.
      - name: term_name
        description: Term name attached to the subscription.
      - name: billing_period
        description: Billing period attached to the subscription.
      - name: subscription_weight
        description: >
          Number of subscriptions this subscription counts as, from dim_term (2 for group plans, 10 for Business 10, 25
          for Business 25, otherwise 1). Sum it for weighted subscriber counts.
        tests:
          - not_null
      - name: subscription_period_number
        description: Latest observed subscription period number.
      - name: geo_id
        description: Geographic identifier for the visitor's location.
      - name: geo_country
        description: Country of the visitor's location.
      - name: geo_region
        description: Region of the visitor's location.
      - name: geo_city
        description: City of the visitor's location.
      - name: cohort_month
        description: Month when the visitor was part of the cohort.
      - name: mrr_amount
        description: Current MRR amount for the subscription, set to zero when superseded by an upgrade.
        tests:
          - not_null
      - name: subscriber_status
        description: Current status of the subscriber.
      - name: days_since_churned
        description: Number of days since the subscriber churned.
      - name: conversion_date
        description: Date when the conversion occurred.
      - name: days_since_conversion
        description: Number of days since the conversion occurred.
      - name: months_since_conversion
        description: Number of months since the conversion occurred.

  - name: fct_subscription_events
    description: Event-level fact table for subscription lifecycle events and status changes.
    columns:
      - name: subscription_action_id
        description: Surrogate key for the subscription action (combination of subscription_id, event_time and subscription_action).
        tests:
          - not_null
          - unique
      - name: conversion_id
        description: Identifier for the conversion associated with the event.
      - name: event_time
        description: Timestamp of the subscription event.
        tests:
          - not_null
      - name: subscription_action
        description: The type of subscription action.
        tests:
          - not_null
      - name: user_id
        description: Piano unique identifier for the subscribed user.
        tests:
          - not_null:
              config:
                severity: warn
      - name: user_first_party_id
        description: First-party identifier for the user aka FED_ID
      - name: subscription_id
        description: Identifier for the subscription.
      - name: created_via_upgrade
        description: Indicates if the subscription was created via an upgrade.
      - name: conversion_device_platform_id
        description: Device platform (app type, device type and operating system group) of the conversion that created the subscription.
      - name: conversion_payment_provider
        description: >
          Billing channel of the conversion that created the subscription, from fct_conversions.payment_provider:
          Stripe Elements or Braintree Credit Card for web checkouts, Apple App Store or Google Play for app store
          subscriptions. Independent of conversion_device_platform_id: a Stripe checkout can happen in the app.
          Lifecycle events inherit it from the conversion.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Stripe Elements", "Braintree Credit Card", "Apple App Store", "Google Play"]
      - name: term_id
        description: Identifier for the subscription term associated with the event.
      - name: term_name
        description: Name of the subscription term associated with the event.
      - name: billing_period
        description: The billing period for the subscription.
      - name: subscription_period_number
        description: The period number for the subscription.
      - name: geo_id
        description: Geographic identifier for the visitor's location.
      - name: geo_country
        description: Country of the visitor's location.
      - name: geo_region
        description: Region of the visitor's location.
      - name: geo_city
        description: City of the visitor's location.
      - name: cohort_month
        description: Month when the visitor was part of the cohort.
      - name: transaction_value
        description: The value of the transaction.
      - name: previous_transaction_value
        description: The value of the previous transaction.
      - name: previous_mrr
        description: The subscription's MRR before this event (0 for the first event).
      - name: mrr_change_amount
        description: Change in MRR caused by this event (current_mrr - previous_mrr). Summing it over a subscription's events up to a point in time gives its MRR at that time.
      - name: current_mrr
        description: The subscription's MRR after this event. Set by new, upgraded and renewed subscriptions (annual values / 12; renewals without a value keep the last known price), set to 0 by Canceled, Expired, Renewal failed (will not retry) and Upgrade completed, and carried forward by all other events.

  - name: fct_cohort_retention
    description: Cohort retention fact table measuring subscriber retention by cohort and period.
    columns:
      - name: term_id
        description: Identifier for the subscription term associated with the event.
        tests:
          - not_null
      - name: conversion_device_platform_id
        description: Device platform (app type, device type and operating system group) of the conversion that created the subscription.
      - name: billing_period
        description: The billing period for the subscription.
      - name: cohort
        description: The cohort to which the subscriber belongs.
        tests:
          - not_null
      - name: cohort_size
        description: Number of users in the cohort.
        tests:
          - not_null
      - name: months_since_conversion
        description: Number of months since the conversion event.
        tests:
          - not_null
      - name: active_subscribers
        description: Number of active subscribers in the cohort and period.
        tests:
          - not_null

  - name: fct_marketing_spend
    description: Marketing spend fact table for subscription acquisition and retention campaigns.
    columns:
      - name: date_day
        description: Date of the spend observation.
      - name: channel
        description: Marketing channel for the spend observation.
      - name: campaign_name
        description: Campaign name for the spend observation.
      - name: spend_amount
        description: Spend amount for the spend observation.
      - name: impressions
        description: Number of impressions for the spend observation.
      - name: clicks
        description: Number of clicks for the spend observation.
      - name: conversions
        description: Number of conversions attributed to the spend observation.
      - name: revenue_amount
        description: Revenue attributable to the spend observation.

  - name: fct_subscription_attribution
    description: Attribution model output for marketing touchpoints and conversion outcomes.
    columns:
      - name: event_date
        description: Date of the attribution event.
        tests:
          - not_null
      - name: event_url_full
        description: Full URL of the attribution event.
      - name: visitor_id
        description: Identifier for the visitor.
      - name: geo_country
        description: Country of the visitor.
      - name: browser
        description: Browser used by the visitor.
      - name: device_type
        description: Type of device used by the visitor.
      - name: site_id
        description: Identifier for the site.
      - name: pageview_id
        description: Identifier for the page view.
      - name: content_pillar
        description: Content pillar to which the attribution event belongs.
      - name: event_name
        description: Name of the attribution event.
      - name: src_detail
        description: Detail of the source for the attribution event.
      - name: src
        description: Source of the attribution event.
      - name: attribution_source
        description: Source of the attribution.
      - name: attribution_source_detail
        description: Detail of the source for the attribution event.
      - name: src_bbc_team
        description: BBC team associated with the source of the attribution event.
      - name: src_ptr_name
        description: Name of the source pointer for the attribution event.
      - name: src_creative_id
        description: Identifier for the creative associated with the source of the attribution event.
      - name: src_organic
        description: Indicates if the source is organic.
      - name: src_organic_detail
        description: Detail of the organic source for the attribution event.
      - name: src_campaign
        description: Campaign associated with the source of the attribution event.
      - name: src_adset_name
        description: Ad set name associated with the source of the attribution event.
      - name: src_medium
        description: Medium associated with the source of the attribution event.
      - name: src_sl_term
        description: Search term associated with the source of the attribution event.
      - name: src_campaign_type
        description: Type of campaign associated with the source of the attribution event.
      - name: src_format
        description: Format associated with the source of the attribution event.
      - name: vx_promo_code
        description: Promotional code associated with the attribution event.
      - name: billing_period
        description: Billing period associated with the attribution result.
      - name: trial_duration
        description: Trial duration associated with the attribution result.
      - name: subscription_id
        description: Subscription identifier associated with the conversion.
      - name: subscription_action
        description: Action taken on the subscription.
      - name: subscription_period_number
        description: Number of periods for which the subscription is active.
      - name: cart_turnovertaxfree
        description: Cart turnover excluding tax.
      - name: signup_event
        description: Signup event associated with the subscription.
      - name: link_origin
        description: Origin of the link associated with the subscription.
      - name: signup_page
        description: Page from which the signup was initiated.
      - name: at_adset_name
        description: Ad set name associated with the attribution event.
      - name: at_adset_id
        description: Ad set ID associated with the attribution event.
      - name: at_objective
        description: Objective associated with the attribution event.
      - name: at_medium
        description: Medium associated with the attribution event.
      - name: at_creation
        description: Timestamp at which the attribution was created.
      - name: at_keyword
        description: Keyword associated with the attribution event.
      - name: at_matchtype
        description: Match type associated with the attribution event.
      - name: at_campaign_name
        description: Campaign name associated with the attribution event.
      - name: is_paid_event
        description: Flag indicating if the event is paid.
      - name: first_event
        description: Flag indicating if this is the first event for the user.
      - name: last_event
        description: Flag indicating if this is the last event for the user.
      - name: promo_code_from_conversion
        description: Promotional code associated with the conversion.
      - name: position_weight
        description: Weight associated with the position of the attribution event.
      - name: position_signup_touch_weight
        description: Weight associated with the position of the signup touchpoint.
      - name: first_touch
        description: Flag indicating if this is the first touchpoint for the user.
      - name: last_touch
        description: Flag indicating if this is the last touchpoint for the user.
      - name: signup_touch
        description: Flag indicating if this is the signup touchpoint for the user.
      - name: billing_period_filled
        description: Flag indicating if the billing period is filled.
      - name: subscription_id_filled
        description: Flag indicating if the subscription ID is filled.
      - name: revenue_filled
        description: Flag indicating if the revenue is filled.
      - name: revenue_weighted_a
        description: Weighted revenue for the first attribution event.
      - name: annualised_revenue_a
        description: Annualised revenue for the first attribution event.
      - name: date_of_creation
        description: Date at which the record was created.
      - name: date_of_latest_renewal
        description: Date of the latest renewal for the subscription.
      - name: months_between_creation_and_renewal
        description: Number of months between the creation and the latest renewal of the subscription.
      - name: revenue_weighted
        description: Weighted revenue for the subscription
      - name: annualised_revenue
        description: Annualised revenue for the subscription.

  - name: fct_page_views
    description: >
      Page view fact table. One row per pageview_id; the grain is guaranteed upstream by
      int_piano__page_views. Joins pre-aggregated scroll depth, click, ad impression and
      event duration measures (all already at page view grain, so no fan-out) and carries
      surrogate keys for content, user, visit, geography, device and site. Web page views
      only: Piano populates pageview_id for web (js) traffic only. Incremental: merges on
      pageview_id, reprocessing from the day before the latest loaded page view date, with
      the MERGE limited to recent target rows by incremental_predicates; dev builds only the
      last 30 days. History is built in date chunks with the piano_backfill_start /
      piano_backfill_end vars, together with int_piano__page_views (see the DNS
      Transformations Runbook). full_refresh is false, so --full-refresh is ignored; to
      rebuild, drop the table and backfill in chunks.
    columns:
      - name: pageview_id
        description: Primary key. Unique page view identifier.
        tests:
          - unique
          - not_null
      - name: content_sk
        description: Surrogate key of content_id.
      - name: user_sk
        description: Surrogate key of user_id.
      - name: visit_sk
        description: Surrogate key of visit_id.
      - name: geography_sk
        description: Surrogate key of (geo_country_code_alpha2, geo_region, geo_city).
      - name: device_platform_id
        description: Device platform (app type, device type and operating system group) of the page view, from its latest page.display event.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_device_platform')
                field: device_platform_id
      - name: site_sk
        description: Surrogate key of site_id.
      - name: user_id
        description: Piano user identifier (43 characters), repaired in int_piano__events_cleaned.
      - name: visitor_id
        description: >
          Persistent visitor identifier (browser/device level). Natural key for unique
          visitor counts and the denominator of Piano Time Spent / Visitor.
      - name: visit_id
        description: Piano visit (session) identifier.
      - name: site_id
        description: Piano site identifier.
        tests:
          - not_null
      - name: visitor_new_return
        description: >
          Whether the visitor was new or returning at the time of this page view. Kept on
          the fact because it is state at page view time.
      - name: visitor_is_signed_in
        description: Whether the visitor was signed in during this page view. State at page view time.
      - name: user_first_party_id
        description: First-party user identifier aka FED_ID (24, 44 or 64 characters), repaired in int_piano__events_cleaned.
      - name: device_first_party_id
        description: Piano first-party device identifier.
      - name: browser_group
        description: Browser family as Piano reports it (Chrome, Safari, ...). Unknown when blank. For native app page views this is the webview engine.
      - name: os_version
        description: Operating system version as Piano reports it. Taken from the page view's latest page.display event.
      - name: app_name
        description: Application or property name as Piano reports it (e.g. bbc_web, top-gear). Taken from the page view's latest page.display event.
      - name: page
        description: Piano page name. Taken from the page view's latest page.display event.
      - name: url
        description: Page URL. Taken from the page view's latest page.display event.
      - name: content_section
        description: Content section of the page. Taken from the page view's latest page.display event.
      - name: content_pillar
        description: Content pillar of the page. Taken from the page view's latest page.display event.
      - name: content_type
        description: Content type of the page (article, video, ...). Taken from the page view's latest page.display event.
      - name: date_published
        description: Publication date of the content, as Piano receives it. Taken from the page view's latest page.display event.
      - name: article_word_count
        description: Word count of the article, as Piano receives it. Taken from the page view's latest page.display event.
      - name: src
        description: Piano traffic source (e.g. Direct traffic, Search engines). Piano attributes the source at visit level. Taken from the page view's latest page.display event.
      - name: src_campaign
        description: Piano source campaign. Piano attributes the source at visit level. Taken from the page view's latest page.display event.
      - name: src_detail
        description: Piano source detail. Piano attributes the source at visit level. Taken from the page view's latest page.display event.
      - name: src_url
        description: Piano source URL. Piano attributes the source at visit level. Taken from the page view's latest page.display event.
      - name: src_bbc_team
        description: Piano source attribute, BBC team that owns the campaign. Piano attributes the source at visit level.
      - name: src_creative_id
        description: Piano source attribute, campaign creative identifier. Piano attributes the source at visit level.
      - name: src_creation
        description: Piano source attribute, campaign creative name. Piano attributes the source at visit level.
      - name: src_ptr_name
        description: Piano source attribute, partner name. Piano attributes the source at visit level.
      - name: src_adset_name
        description: Piano source attribute, ad set name. Piano attributes the source at visit level.
      - name: src_adset_id
        description: Piano source attribute, ad set identifier. Piano attributes the source at visit level.
      - name: src_objective
        description: Piano source attribute, campaign objective. Piano attributes the source at visit level.
      - name: src_format
        description: Piano source attribute, campaign format. Piano attributes the source at visit level.
      - name: src_organic_detail
        description: Piano source attribute, organic source detail. Piano attributes the source at visit level.
      - name: src_sl_term
        description: Piano source attribute, sponsored link search term. Piano attributes the source at visit level.
      - name: url_at_bbc_team
        description: at_bbc_team campaign tag parsed from this page's landing URL (event_url_full); NULL when the URL has no such parameter. Can differ from the visit-level src_* attribute.
      - name: url_at_creative_id
        description: at_creative_id campaign tag parsed from this page's landing URL (event_url_full); NULL when the URL has no such parameter. Can differ from the visit-level src_* attribute.
      - name: url_at_campaign
        description: at_campaign campaign tag parsed from this page's landing URL (event_url_full); NULL when the URL has no such parameter. Can differ from the visit-level src_* attribute.
      - name: url_at_link_origin
        description: at_link_origin campaign tag parsed from this page's landing URL (event_url_full); NULL when the URL has no such parameter. Can differ from the visit-level src_* attribute.
      - name: url_at_ptr_name
        description: at_ptr_name campaign tag parsed from this page's landing URL (event_url_full); NULL when the URL has no such parameter. Can differ from the visit-level src_* attribute.
      - name: url_at_adset_name
        description: at_adset_name campaign tag parsed from this page's landing URL (event_url_full); NULL when the URL has no such parameter. Can differ from the visit-level src_* attribute.
      - name: url_at_adset_id
        description: at_adset_id campaign tag parsed from this page's landing URL (event_url_full); NULL when the URL has no such parameter. Can differ from the visit-level src_* attribute.
      - name: url_at_objective
        description: at_objective campaign tag parsed from this page's landing URL (event_url_full); NULL when the URL has no such parameter. Can differ from the visit-level src_* attribute.
      - name: url_at_medium
        description: at_medium campaign tag parsed from this page's landing URL (event_url_full); NULL when the URL has no such parameter. Can differ from the visit-level src_* attribute.
      - name: url_at_matchtype
        description: at_matchtype campaign tag parsed from this page's landing URL (event_url_full); NULL when the URL has no such parameter. Can differ from the visit-level src_* attribute.
      - name: url_at_keyword
        description: at_keyword campaign tag parsed from this page's landing URL (event_url_full); NULL when the URL has no such parameter. Can differ from the visit-level src_* attribute.
      - name: url_at_creation
        description: at_creation campaign tag parsed from this page's landing URL (event_url_full); NULL when the URL has no such parameter. Can differ from the visit-level src_* attribute.
      - name: url_at_campaign_name
        description: at_campaign_name campaign tag parsed from this page's landing URL (event_url_full); NULL when the URL has no such parameter. Can differ from the visit-level src_* attribute.
      - name: template_display_mode
        description: Composer template display mode. Only sent on Composer events (experience.action, experience.interaction, vx.conversion), so NULL on page views.
      - name: template_closable
        description: Whether the Composer template can be closed. Only sent on Composer events, so NULL on page views.
      - name: c1x_brand_relationship
        description: C1X brand relationship segment, as Piano sends it. Taken from the page view's latest page.display event.
      - name: c1x_checkout_abandonment
        description: C1X checkout abandonment segment, as Piano sends it. Taken from the page view's latest page.display event.
      - name: c1x_content_likely_to_convert
        description: C1X content likely to convert segment, as Piano sends it. Taken from the page view's latest page.display event.
      - name: c1x_expiring_subscribers
        description: C1X expiring subscribers segment, as Piano sends it. Taken from the page view's latest page.display event.
      - name: c1x_likelihood_to_register
        description: C1X likelihood to register segment, as Piano sends it. Taken from the page view's latest page.display event.
      - name: c1x_likelihood_to_return
        description: C1X likelihood to return segment, as Piano sends it. Taken from the page view's latest page.display event.
      - name: c1x_ltc
        description: C1X ltc segment, as Piano sends it. Taken from the page view's latest page.display event.
      - name: c1x_lts
        description: C1X lts segment, as Piano sends it. Taken from the page view's latest page.display event.
      - name: c1x_revenue_auto_optimization
        description: C1X revenue auto optimization segment, as Piano sends it. Taken from the page view's latest page.display event.
      - name: c1x_subscription_length
        description: C1X subscription length segment, as Piano sends it. Taken from the page view's latest page.display event.
      - name: c1x_subscription_tenure
        description: C1X subscription tenure segment, as Piano sends it. Taken from the page view's latest page.display event.
      - name: c1x_visitor_frequency
        description: C1X visitor frequency segment, as Piano sends it. Taken from the page view's latest page.display event.
      - name: c1x_visitor_interest
        description: C1X visitor interest segment, as Piano sends it (an array). Taken from the page view's latest page.display event.
      - name: c1x_visitor_recency
        description: C1X visitor recency segment, as Piano sends it. Taken from the page view's latest page.display event.
      - name: page_view_time
        description: Timestamp of the page view (first page.display event), local time.
        tests:
          - not_null
      - name: page_view_time_utc
        description: Timestamp of the page view (first page.display event), UTC.
      - name: page_view_date
        description: Date of the page view, derived from page_view_time.
        tests:
          - not_null
      - name: page_display_event_count
        description: Distinct page.display event_ids in the page view. Piano's Pageviews metric is the sum of this column.
      - name: page_duration_seconds
        description: Time spent on the page in seconds.
      - name: visit_duration_seconds
        description: >
          Session duration in seconds (Piano rounds to the nearest second). Filter for Piano
          Time Spent / Visit (visit_duration > 0).
      - name: event_duration_ms
        description: >
          Sum of event_duration in milliseconds across all events in the page view. Numerator
          of Piano time-spent metrics; the visitor-level filter (event_duration > 0) applies
          to this column.
      - name: events_with_duration_count
        description: Number of events in the page view with event_duration > 0.
      - name: scroll_depth_pct
        description: Maximum scroll depth as a percentage (0-100).
      - name: click_count
        description: >
          Total click events on this page view (click.*, viewability.select,
          subscription.select, ad.click, internal_search_result.click, av.ad.click).
          newsletter.subscribe and experience.interaction are counted separately.
      - name: viewability_view_count
        description: viewability.view events. Always 0 at present because int_piano__events_cleaned does not select viewability.view.
      - name: newsletter_subscribe_count
        description: newsletter.subscribe events. Not included in click_count.
      - name: experience_interaction_count
        description: experience.interaction events. Not included in click_count.
      - name: ad_impression_count
        description: Total ad impressions on this page view.
      - name: ad_revenue
        description: Total ad revenue attributed to this page view.
