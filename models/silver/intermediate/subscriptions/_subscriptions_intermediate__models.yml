version: 2

models:
  - name: int_facebook_ads__creative_history
    description: Intermediate table that enriches Facebook ad creative history with parsed URL fields and UTM/Piano attribution tags for downstream campaign analysis.
    columns:
      - name: source_relation
        description: Source relation identifier used to distinguish data from different upstream ad sources.
        tests:
          - not_null
      - name: _fivetran_id
        description: Fivetran row identifier for the source record.
        tests:
          - not_null
      - name: creative_id
        description: Unique identifier for the Facebook ad creative.
        tests:
          - not_null
      - name: account_id
        description: Facebook ad account identifier associated with the creative.
      - name: creative_name
        description: Human-readable name of the ad creative.
      - name: url
        description: Full destination URL attached to the creative.
      - name: base_url
        description: Destination URL without query parameters.
      - name: url_host
        description: Hostname extracted from the creative URL.
      - name: at_parameter
        description: Piano attribution parameter captured from the ad URL.
      - name: at_bbc_team
        description: BBC team identifier extracted from the ad attribution tags.
      - name: utm_campaign
        description: UTM campaign value used to trace traffic back to a campaign.

  - name: int_piano__conversion_attribution_app
    description: Intermediate app conversion table that joins offsite app conversions to the latest relevant app experience events and carries forward experience, card, and template metadata.
    columns:
      - name: conversion_id
        description: Unique identifier for the conversion event.
        tests:
          - not_null
          - unique
      - name: subscription_id
        description: Subscription identifier associated with the conversion.
      - name: visitor_id
        description: Piano visitor identifier for the conversion journey.
      - name: user_id 
        description: Piano user identifier
      - name: user_first_party_id
        description: First-party user identifier aka FED_ID.
      - name: visit_id
        description: Piano visit identifier
      - name: visit_time
        description: Timestamp of the piano visit.
      - name: device_platform_id
        description: Device platform of the conversion event, with app type forced to Mobile App.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_device_platform')
                field: device_platform_id
      - name: conversion_time
        description: Timestamp of the conversion event.
        tests:
          - not_null
      - name: conversion_date
        description: Date of the conversion event.
        tests:
          - not_null
      - name: term_id
        description: Term identifier for the conversion.
      - name: term_name
        description: Term name for the conversion.
      - name: term_offer_id
        description: Term offer identifier for the conversion.
      - name: term_offer_name
        description: Term offer name for the conversion.
      - name: billing_period
        description: Billing period for the conversion.
      - name: payment_provider
        description: >
          Where the subscription is billed, observed on the conversion event: Apple App Store or Google Play from
          the offsite event's external_api_source, or the payment provider (Stripe Elements) for web checkouts
          that Piano reports offsite.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Apple App Store", "Google Play", "Stripe Elements", "Braintree Credit Card"]
      - name: cart_turnovertaxfree
        description: >
          Net revenue for the conversion. App store conversions carry no value, so it is the list price less the
          store fee for the observed payment_provider (30% Apple App Store, 15% Google Play). Web checkouts
          reported offsite keep the charge Piano recorded, with no store fee.
      - name: subscription_period_number
        description: Number of the subscription period associated with the conversion.
      - name: created_via_upgrade
        description: Flag indicating whether the subscription was created through an upgrade flow.
      - name: src
        description: Traffic source associated with the conversion.
      - name: src_detail
        description: More specific traffic source detail for the conversion.
      - name: geo_country
        description: Country derived from the visitor's geography.
      - name: geo_region
        description: Region derived from the visitor's geography.
      - name: geo_city
        description: City derived from the visitor's geography.
      - name: cohort_month
        description: Cohort month derived from the conversion time.
      - name: experience_id
        description: Attributed Piano experience identifier for the conversion.
        tests:
          - not_null
      - name: card_id
        description: Attributed Piano card identifier for the conversion.
      - name: card_action
        description: Attributed Piano card action for the conversion.
      - name: template_id
        description: Attributed Piano template identifier for the conversion.
        tests:
          - not_null
      - name: ab_test_variant_name
        description: A/B test variant associated with the conversion.
      - name: c1x_lts
        description: C1X lifetime value score carried through from the attributed interaction or action.
      - name: c1x_likelihood_to_register
        description: C1X likelihood-to-register score carried through from the attributed event.
      - name: c1x_lilelihood_to_return
        description: C1X likelihood-to-return score carried through from the attributed event.
      - name: c1x_revenue_auto_optimization
        description: C1X revenue auto-optimization score carried through from the attributed event.

  - name: int_piano__conversion_attribution_web
    description: Intermediate web conversion table that links each conversion to the most relevant experience action, interaction, and subscribe-click behaviour from the prior day.
    columns:
      - name: conversion_id
        description: Unique identifier for the conversion event.
        tests:
          - not_null
          - unique
      - name: subscription_id
        description: Subscription identifier associated with the conversion.
      - name: visitor_id
        description: Piano visitor identifier for the conversion journey.
      - name: user_id 
        description: Piano user identifier
      - name: user_first_party_id
        description: First-party user identifier aka FED_ID.
      - name: visit_id
        description: Piano visit identifier
      - name: visit_time
        description: Timestamp of the piano visit.
      - name: device_platform_id
        description: Device platform of the conversion event, with app type forced to Web.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_device_platform')
                field: device_platform_id
      - name: conversion_time
        description: Timestamp of the conversion event.
        tests:
          - not_null
      - name: conversion_date
        description: Date of the conversion event.
        tests:
          - not_null
      - name: term_id
        description: Term identifier for the conversion.
      - name: term_name
        description: Term name for the conversion.
      - name: term_offer_id
        description: Term offer identifier for the conversion.
      - name: term_offer_name
        description: Term offer name for the conversion.
      - name: billing_period
        description: Billing period for the conversion.
      - name: payment_provider
        description: Payment provider on the conversion event (Stripe Elements or Braintree Credit Card).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Stripe Elements", "Braintree Credit Card"]
      - name: cart_turnovertaxfree
        description: Revenue excluding tax recorded by Piano on the conversion event.
      - name: subscription_period_number
        description: Number of the subscription period associated with the conversion.
      - name: created_via_upgrade
        description: Flag indicating whether the subscription was created through an upgrade flow.
      - name: src
        description: Traffic source associated with the conversion.
      - name: src_detail
        description: More specific traffic source detail for the conversion.
      - name: geo_country
        description: Country derived from the visitor's geography.
      - name: geo_region
        description: Region derived from the visitor's geography.
      - name: geo_city
        description: City derived from the visitor's geography.
      - name: cohort_month
        description: Cohort month derived from the conversion time.
      - name: experience_id
        description: Attributed Piano experience identifier for the conversion.
        tests:
          - not_null
      - name: card_id
        description: Attributed Piano card identifier for the conversion.
      - name: card_action
        description: Attributed Piano card action for the conversion.
      - name: template_id
        description: Attributed Piano template identifier for the conversion.
        tests:
          - not_null
      - name: ab_test_variant_name
        description: A/B test variant associated with the conversion.
      - name: c1x_lts
        description: C1X lifetime value score carried through from the attributed interaction or action.
      - name: c1x_likelihood_to_register
        description: C1X likelihood-to-register score carried through from the attributed event.
      - name: c1x_lilelihood_to_return
        description: C1X likelihood-to-return score carried through from the attributed event.
      - name: c1x_revenue_auto_optimization
        description: C1X revenue auto-optimization score carried through from the attributed event.

  - name: int_piano__exposures_app
    description: Intermediate mobile-app exposure table that captures app-side Composer exposures and joins them to experience metadata for downstream exposure analysis.
    columns:
      - name: experience_execution_id
        description: Identifier for the specific Composer experience execution.
      - name: exposure_id
        description: Surrogate key uniquely identifying the exposure event.
        tests:
          - not_null
          - unique
      - name: exposure_time
        description: Timestamp of the exposure event.
        tests:
          - not_null
      - name: experience_execution_id
        description: Identifier for the specific Composer experience execution.
      - name: experience_id
        description: Piano experience identifier associated with the exposure.
        tests:
          - relationships:
              arguments:
                to: ref('dim_experience')
                field: experience_id
      - name: card_id
        description: Piano card identifier associated with the exposure.
      - name: template_id
        description: Piano template identifier associated with the exposure.
        tests:
          - relationships:
              arguments:
                to: ref('dim_template')
                field: template_id
      - name: device_platform_id
        description: Device platform of the exposure event, with app type forced to Mobile App.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_device_platform')
                field: device_platform_id

  - name: int_piano__exposures_web
    description: Intermediate web exposure table that builds a deduplicated set of web Composer exposure events with page, geography, and experience attributes.
    columns:
      - name: experience_execution_id
        description: Identifier for the specific Composer experience execution.
      - name: exposure_id
        description: Surrogate key uniquely identifying the exposure event.
        tests:
          - not_null
          - unique
      - name: exposure_time
        description: Timestamp of the exposure event.
        tests:
          - not_null
      - name: pageview_id
        description: Page view identifier associated with the exposure event.
        tests:
          - not_null
      - name: visitor_id
        description: Piano visitor identifier linked to the exposure.
      - name: experience_id
        description: Piano experience identifier associated with the exposure.
        tests:
          - relationships:
              arguments:
                to: ref('dim_experience')
                field: experience_id
      - name: card_id
        description: Piano card identifier associated with the exposure.
      - name: template_id
        description: Piano template identifier associated with the exposure.
        tests:
          - relationships:
              arguments:
                to: ref('dim_template')
                field: template_id
      - name: page
        description: Page path associated with the exposure event.
      - name: geo_country
        description: Country derived from the visitor's geography.
      - name: ab_test_variant_name
        description: A/B test variant associated with the exposure.

  - name: int_piano__offsite_conversion_event_consolidation
    description: Intermediate table that consolidates offsite app-store conversion events with the closest onsite mobile-app conversion record for attribution.
    columns:
      - name: conversion_id
        description: Unique identifier for the offsite conversion event.
        tests:
          - not_null
          - unique
      - name: subscription_id
        description: Subscription identifier associated with the conversion.
      - name: visitor_id
        description: Piano visitor identifier for the matched conversion journey.
        tests:
          - not_null
      - name: user_first_party_id
        description: First-party user identifier AKA FED_ID
      - name: visit_id
        description: Piano visit identifier for the matched conversion journey.
      - name: visit_time
        description: Timestamp of the piano visit for the matched conversion journey.
      - name: device_platform_id
        description: Device platform of the matched onsite conversion event, with app type forced to Mobile App.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_device_platform')
                field: device_platform_id
      - name: conversion_time
        description: Timestamp of the consolidated conversion event.
        tests:
          - not_null
      - name: term_id
        description: Term identifier for the conversion.
        tests:
          - relationships:
              arguments:
                to: ref('dim_term')
                field: term_id
      - name: term_name
        description: Term name for the conversion.
      - name: term_offer_name
        description: Term offer name for the conversion.
      - name: term_offer_id
        description: Offer identifier associated with the subscription term.
      - name: billing_period
        description: Billing period for the subscription term.
      - name: payment_provider
        description: >
          Where the subscription is billed: Apple App Store or Google Play from the offsite event's
          external_api_source, otherwise the event's payment_provider (Stripe Elements for web checkouts that
          Piano reports offsite).
        tests:
          - not_null
      - name: cart_turnovertaxfree
        description: >
          Revenue excluding tax recorded on the offsite event. Present only for web checkouts reported offsite;
          app store conversions carry no value.
      - name: subscription_period_number
        description: Number of the subscription period associated with the conversion.
      - name: created_via_upgrade
        description: Flag indicating whether the subscription was created through an upgrade flow.
      - name: src
        description: Traffic source associated with the conversion.
      - name: src_detail
        description: More specific traffic source detail for the conversion.
      - name: geo_id
        description: Geographic identifier for the conversion.
      - name: geo_country
        description: Country identifier for the conversion.
      - name: geo_region
        description: Region identifier for the conversion.
      - name: geo_city
        description: City identifier for the conversion.

  - name: int_subscription__survival
    description: Intermediate subscriber survival table that captures each subscriber's start date, churn date, churn flag, and observed duration for retention analysis.
    columns:
      - name: subscription_id
        description: Subscription identifier used as the primary key for the survival record.
        tests:
          - not_null
      - name: experience_type
        description: Classification of the subscriber experience as LFV or Non-LFV based on the attributed experience name.
      - name: term_id
        description: Subscription term identifier for the subscriber's initial subscription.
      - name: billing_period
        description: Billing period associated with the subscriber's initial term.
      - name: conversion_device_platform_id
        description: Device platform (app type, device type and operating system group) of the subscriber's initial conversion event.
      - name: start_date
        description: Date of the subscriber's first observed subscription event.
        tests:
          - not_null
      - name: churn_date
        description: Date of the subscriber's churn event, if one exists.
      - name: churn_event
        description: Binary indicator showing whether the subscriber churned before the censoring date.
        tests:
          - not_null
      - name: duration_days
        description: Number of days observed between the start date and the churn or censoring date.
        tests:
          - not_null
