version: 2

models:
  - name: int_facebook_ads__creative_history
    description: Intermediate table that enriches Facebook ad creative history with parsed URL fields and UTM/Piano attribution tags for downstream campaign analysis.
    columns:
      - name: source_relation
        description: Source relation identifier used to distinguish data from different upstream ad sources.
        tests:
          - not_null
      - name: _fivetran_id
        description: Fivetran row identifier for the source record.
        tests:
          - not_null
      - name: creative_id
        description: Unique identifier for the Facebook ad creative.
        tests:
          - not_null
      - name: account_id
        description: Facebook ad account identifier associated with the creative.
      - name: creative_name
        description: Human-readable name of the ad creative.
      - name: url
        description: Full destination URL attached to the creative.
      - name: base_url
        description: Destination URL without query parameters.
      - name: url_host
        description: Hostname extracted from the creative URL.
      - name: at_parameter
        description: Piano attribution parameter captured from the ad URL.
      - name: at_bbc_team
        description: BBC team identifier extracted from the ad attribution tags.
      - name: utm_campaign
        description: UTM campaign value used to trace traffic back to a campaign.

  - name: int_piano__conversion_attribution_app
    description: Intermediate app conversion table that joins offsite app conversions to the latest relevant app experience events and carries forward experience, card, and template metadata.
    columns:
      - name: conversion_id
        description: Unique identifier for the conversion event.
        tests:
          - not_null
          - unique
      - name: subscription_id
        description: Subscription identifier associated with the conversion.
      - name: visitor_id
        description: Piano visitor identifier for the conversion journey.
      - name: user_id 
        description: Piano user identifier
      - name: user_first_party_id
        description: First-party user identifier aka FED_ID.
      - name: visit_id
        description: Piano visit identifier
      - name: visit_time
        description: Timestamp of the piano visit.
      - name: app_type_id
        description: Surrogate key identifying the app type as Mobile App.
        tests:
          - relationships:
              arguments:
                to: ref('dim_app_type')
                field: app_type_id
      - name: device_type_id
        description: Surrogate key for the device type used in the conversion event.
        tests:
          - relationships:
              arguments:
                to: ref('dim_device_type')
                field: device_type_id
      - name: os_group_id
        description: Surrogate key for the operating system group used in the conversion event.
        tests:
          - relationships:
              arguments:
                to: ref('dim_os_group')
                field: os_group_id
      - name: conversion_time
        description: Timestamp of the conversion event.
        tests:
          - not_null
      - name: conversion_date
        description: Date of the conversion event.
        tests:
          - not_null
      - name: term_id
        description: Term identifier for the conversion.
      - name: term_name
        description: Term name for the conversion.
      - name: term_offer_id
        description: Term offer identifier for the conversion.
      - name: term_offer_name
        description: Term offer name for the conversion.
      - name: billing_period
        description: Billing period for the conversion.
      - name: cart_turnovertaxfree
        description: Net revenue for the conversion after adjusting for app store fees.
      - name: subscription_period_number
        description: Number of the subscription period associated with the conversion.
      - name: created_via_upgrade
        description: Flag indicating whether the subscription was created through an upgrade flow.
      - name: src
        description: Traffic source associated with the conversion.
      - name: src_detail
        description: More specific traffic source detail for the conversion.
      - name: geo_country
        description: Country derived from the visitor's geography.
      - name: geo_region
        description: Region derived from the visitor's geography.
      - name: geo_city
        description: City derived from the visitor's geography.
      - name: cohort_month
        description: Cohort month derived from the conversion time.
      - name: experience_id
        description: Attributed Piano experience identifier for the conversion.
        tests:
          - not_null
      - name: card_id
        description: Attributed Piano card identifier for the conversion.
      - name: card_action
        description: Attributed Piano card action for the conversion.
      - name: template_id
        description: Attributed Piano template identifier for the conversion.
        tests:
          - not_null
      - name: ab_test_variant_name
        description: A/B test variant associated with the conversion.
      - name: c1x_lts
        description: C1X lifetime value score carried through from the attributed interaction or action.
      - name: c1x_likelihood_to_register
        description: C1X likelihood-to-register score carried through from the attributed event.
      - name: c1x_lilelihood_to_return
        description: C1X likelihood-to-return score carried through from the attributed event.
      - name: c1x_revenue_auto_optimization
        description: C1X revenue auto-optimization score carried through from the attributed event.

