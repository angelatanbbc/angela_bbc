  - name: int_piano__exposures_app
    description: Intermediate mobile-app exposure table that captures app-side Composer exposures and joins them to experience metadata for downstream exposure analysis.
    columns:
      - name: experience_execution_id
        description: Identifier for the specific Composer experience execution.
      - name: exposure_id
        description: Surrogate key uniquely identifying the exposure event.
        tests:
          - not_null
          - unique
      - name: exposure_time
        description: Timestamp of the exposure event.
        tests:
          - not_null
      - name: experience_execution_id
        description: Identifier for the specific Composer experience execution.
      - name: experience_id
        description: Piano experience identifier associated with the exposure.
        tests:
          - relationships:
              arguments:
                to: ref('dim_experience')
                field: experience_id
      - name: card_id
        description: Piano card identifier associated with the exposure.
      - name: template_id
        description: Piano template identifier associated with the exposure.
        tests:
          - relationships:
              arguments:
                to: ref('dim_template')
                field: template_id
      - name: app_type_id
        description: Surrogate key identifying the app type as Mobile App.
        tests:
          - relationships:
              arguments:
                to: ref('dim_app_type')
                field: app_type_id
      - name: device_type_id
        description: Surrogate key for the device type used in the exposure event.
        tests:
          - relationships:
              arguments:
                to: ref('dim_device_type')
                field: device_type_id
      - name: os_group_id
        description: Surrogate key for the operating system group used in the exposure event.
        tests:
          - relationships:
              arguments:
                to: ref('dim_os_group')
                field: os_group_id

  - name: int_piano__exposures_web
    description: Intermediate web exposure table that builds a deduplicated set of web Composer exposure events with page, geography, and experience attributes.
    columns:
      - name: experience_execution_id
        description: Identifier for the specific Composer experience execution.
      - name: exposure_id
        description: Surrogate key uniquely identifying the exposure event.
        tests:
          - not_null
          - unique
      - name: exposure_time
        description: Timestamp of the exposure event.
        tests:
          - not_null
      - name: pageview_id
        description: Page view identifier associated with the exposure event.
        tests:
          - not_null
      - name: visitor_id
        description: Piano visitor identifier linked to the exposure.
      - name: experience_id
        description: Piano experience identifier associated with the exposure.
        tests:
          - relationships:
              arguments:
                to: ref('dim_experience')
                field: experience_id
      - name: card_id
        description: Piano card identifier associated with the exposure.
      - name: template_id
        description: Piano template identifier associated with the exposure.
        tests:
          - relationships:
              arguments:
                to: ref('dim_template')
                field: template_id
      - name: page
        description: Page path associated with the exposure event.
      - name: geo_country
        description: Country derived from the visitor's geography.
      - name: ab_test_variant_name
        description: A/B test variant associated with the exposure.

  - name: int_piano__offsite_conversion_event_consolidation
    description: Intermediate table that consolidates offsite app-store conversion events with the closest onsite mobile-app conversion record for attribution.
    columns:
      - name: conversion_id
        description: Unique identifier for the offsite conversion event.
        tests:
          - not_null
          - unique
      - name: subscription_id
        description: Subscription identifier associated with the conversion.
      - name: visitor_id
        description: Piano visitor identifier for the matched conversion journey.
        tests:
          - not_null
      - name: user_first_party_id
        description: First-party user identifier AKA FED_ID
      - name: visit_id
        description: Piano visit identifier for the matched conversion journey.
      - name: visit_time
        description: Timestamp of the piano visit for the matched conversion journey.
      - name: app_type_id
        description: Surrogate key identifying the app type as Mobile App.
        tests:
          - relationships:
              arguments:
                to: ref('dim_app_type')
                field: app_type_id
      - name: device_type_id
        description: Surrogate key for the device type used in the conversion event.
        tests:
          - relationships:
              arguments:
                to: ref('dim_device_type')
                field: device_type_id
      - name: os_group_id
        description: Surrogate key for the operating system group used in the conversion event.
        tests:
          - relationships:
              arguments:
                to: ref('dim_os_group')
                field: os_group_id
      - name: conversion_time
        description: Timestamp of the consolidated conv ersion event.
        tests:
          - not_null
      - name: term_id
        description: Term identifier for the conversion.
        tests:
          - relationships:
              arguments:
                to: ref('dim_term')
                field: term_id
      - name: term_name
        description: Term name for the conversion.
      - name: term_offer_name
        description: Term offer name for the conversion.
      - name: term_offer_id
        description: Offer identifier associated with the subscription term.
      - name: billing_period
        description: Billing period for the subscription term.
      - name: subscription_period_number
        description: Number of the subscription period associated with the conversion.
      - name: created_via_upgrade
        description: Flag indicating whether the subscription was created through an upgrade flow.
      - name: src
        description: Traffic source associated with the conversion.
      - name: src_detail
        description: More specific traffic source detail for the conversion.
      - name: geo_id
        description: Geographic identifier for the conversion.
      - name: geo_country
        description: Country identifier for the conversion.
      - name: geo_region
        description: Region identifier for the conversion.
      - name: geo_city
        description: City identifier for the conversion.

  - name: int_subscription__survival
    description: Intermediate subscriber survival table that captures each subscriber's start date, churn date, churn flag, and observed duration for retention analysis.
    columns:
      - name: subscription_id
        description: Subscription identifier used as the primary key for the survival record.
        tests:
          - not_null
      - name: experience_type
        description: Classification of the subscriber experience as LFV or Non-LFV based on the attributed experience name.
      - name: term_id
        description: Subscription term identifier for the subscriber's initial subscription.
      - name: billing_period
        description: Billing period associated with the subscriber's initial term.
      - name: conversion_app_type_id
        description: Surrogate key identifying the app type for the subscriber's initial conversion event.
      - name: conversion_device_type_id
        description: Surrogate key for the device type used in the subscriber's initial conversion event.
      - name: conversion_os_group_id
        description: Surrogate key for the operating system group used in the subscriber's initial conversion event
      - name: start_date
        description: Date of the subscriber's first observed subscription event.
        tests:
          - not_null
      - name: churn_date
        description: Date of the subscriber's churn event, if one exists.
      - name: churn_event
        description: Binary indicator showing whether the subscriber churned before the censoring date.
        tests:
          - not_null
      - name: duration_days
        description: Number of days observed between the start date and the churn or censoring date.
        tests:
          - not_null

  - name: int_subscription__attribution
    description: Intermediate attribution table that builds an event-level view of marketing touchpoints, flags paid interactions, and assigns position-based weights to support conversion attribution.
    columns:
      - name: event_date
        description: Date of the attribution touchpoint event.
        tests:
          - not_null
      - name: visitor_id
        description: Piano visitor identifier for the attribution journey.
        tests:
          - not_null
      - name: pageview_id
        description: Page view identifier associated with the touchpoint event.
      - name: subscription_id
        description: Subscription identifier tied to the associated conversion journey.
      - name: subscription_action
        description: Subscription lifecycle action associated with the event.
      - name: attribution_source
        description: Final attributed source for the touchpoint after applying promotion and paid-channel logic.
      - name: attribution_source_detail
        description: More granular attribution detail for the source.
      - name: vx_promo_code
        description: Promo code captured on the conversion event, if present.
      - name: is_paid_event
        description: Flag indicating whether the touchpoint was classified as paid traffic.
      - name: position_weight
        description: Position-based attribution weight assigned to the touchpoint.
        tests:
          - not_null
      - name: first_touch
        description: Flag indicating whether the touchpoint is the first event in the attribution journey.
      - name: last_touch
        description: Flag indicating whether the touchpoint is the last event in the attribution journey.
      - name: signup_touch
        description: Flag indicating whether the touchpoint corresponds to the signup event.

  - name: int_subscription__attribution_src_corrected
    description: Intermediate attribution table that corrects missing source values through deterministic redistribution and further splits generic Search engines attribution into specific search engines.
    columns:
      - name: event_date
        description: Date of the attribution touchpoint event.
        tests:
          - not_null
      - name: visitor_id
        description: Piano visitor identifier for the attribution journey.
        tests:
          - not_null
      - name: pageview_id
        description: Page view identifier associated with the touchpoint event.
      - name: attribution_source
        description: Corrected attribution source after redistribution of null or generic values.
        tests:
          - not_null
      - name: attribution_source_detail
        description: More specific attribution source detail after search-engine redistribution.
      - name: subscription_id
        description: Subscription identifier tied to the associated conversion journey.
      - name: subscription_action
        description: Subscription lifecycle action associated with the event.
      - name: position_weight
        description: Position-based attribution weight carried through from the source attribution model.
        tests:
          - not_null
      - name: first_touch
        description: Flag indicating whether the touchpoint is the first event in the attribution journey.
      - name: last_touch
        description: Flag indicating whether the touchpoint is the last event in the attribution journey.
      - name: signup_touch
        description: Flag indicating whether the touchpoint corresponds to the signup event.
