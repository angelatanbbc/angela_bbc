version: 2

sources:
  - name: GOOGLE_ADS
    database: sdp_project_sandbox
    schema: DNS_TRANSFORMATIONS
    description: Source data from google ads.
    tables:
      - name: STG_GOOGLE_ADS
        description: >
          Google ad data, uploaded by hand: one row per ad per day for Google Ads and Microsoft Ads.
          DATE is text in DD/MM/YYYY; AD_ID is a number (12 digits for Google, 14 for Microsoft); the
          BBC team (DBS / 8MS) is in AD_NAME; ACCOUNT_ID is empty. There is no campaign or account.
        config:
          loaded_at_field: "TRY_TO_DATE(DATE, 'DD/MM/YYYY')::TIMESTAMP_NTZ"
          freshness:
            warn_after: {count: 7, period: day}
