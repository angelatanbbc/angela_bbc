version: 2

models:
  - name: agg_subscriber_bans
    description: >
      Tableau-ready BAN metrics with one row per dashboard, metric and comparison period
      as of the latest subscriber snapshot date. Serves the subscriber activity dashboard
      (dashboard_name = 'subscriber_activity') and the acquisition dashboard
      (dashboard_name = 'acquisition'). Acquisition sign-up metrics use fractional
      multi-touch attribution (fct_conversions.paid_attribution_weight), so organic + paid equals total sign-ups;
      pct_annual is treated as higher-is-better on lifetime-value grounds.
      subscription_arpu is MTD subscription transaction value (cart turnover ex-tax)
      per 1,000 distinct site visitors - stored pre-scaled by 1,000 because the
      per-visitor ratio is fractions of a penny; its visitor denominator covers
      US/Canada only (fct_visitors_daily).
    columns:
      - name: subscriber_ban_key
        description: Surrogate key for the dashboard, metric, period type and as-of date.
        tests:
          - not_null
          - unique
      - name: as_of_date
        description: Latest completed subscriber snapshot date used as the reporting date for the BAN values.
        tests:
          - not_null
      - name: dashboard_name
        description: Tableau dashboard or dashboard family that consumes the BAN metric.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['subscriber_activity', 'acquisition']
      - name: metric_name
        description: Stable machine-readable metric identifier.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['active_subscribers', 'engaged_subscribers', 'engaged_subscribers_pct', 'mrr_change', 'avg_subscriber_pageviews_per_visit', 'avg_subscriber_visits_per_period', 'organic_signups', 'paid_signups', 'pct_annual', 'funnel_conv_rate', 'subscription_arpu']
      - name: metric_label
        description: Human-readable metric label for Tableau display.
        tests:
          - not_null
      - name: period_type
        description: Reporting period represented by the metric row.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['LATEST', 'WTD', 'MTD', 'L7D', 'L30D']
      - name: current_start_date
        description: Inclusive start date for the current value calculation.
        tests:
          - not_null
      - name: current_end_date
        description: Inclusive end date for the current value calculation.
        tests:
          - not_null
      - name: prior_start_date
        description: Inclusive start date for the prior comparison calculation.
        tests:
          - not_null
      - name: prior_end_date
        description: Inclusive end date for the prior comparison calculation.
        tests:
          - not_null
      - name: comparison_type
        description: Label describing the prior period used for the comparison.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['MoM', 'Prior WTD', 'Prior MTD', 'Prior Month', 'Prior L7D', 'Prior L30D']
      - name: current_value
        description: Current BAN value for the metric and period.
        tests:
          - not_null
      - name: prior_value
        description: Prior comparison value for the metric and period.
        tests:
          - not_null
      - name: absolute_change
        description: Difference between current_value and prior_value.
        tests:
          - not_null
      - name: pct_change
        description: Percentage change between current_value and prior_value, null when prior_value is zero.
      - name: lifetime_value
        description: >
          All-time total for BANs whose big number is the full history while the change
          columns compare MTD vs prior MTD (acquisition organic_signups, paid_signups
          and pct_annual). Null for all other rows; in Tableau use
          COALESCE(lifetime_value, current_value) for the headline number.
      - name: metric_format
        description: Display format hint for Tableau.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['number', 'currency', 'percentage']
      - name: is_higher_better
        description: Whether a positive movement is considered favorable for display.
        tests:
          - not_null

  - name: agg_acquisition_signups_daily
    description: >
      Daily sign-up counts for the acquisition dashboard, one row per conversion date,
      attribution source, billing period and geography/device/app/OS combination.
      n_signups uses fractional multi-touch attribution (each conversion splits into Paid by its
      paid_attribution_weight and Organic by the rest), so it is fully additive: Tableau can SUM it across any date range or
      dimension filter, and Organic + Paid equals the exact distinct conversion count at
      every grain. Display rounding should happen in Tableau number formatting, not here.
    columns:
      - name: signup_day_key
        description: Surrogate key for the date, attribution source, billing period and dimension combination.
        tests:
          - not_null
          - unique
      - name: conversion_date
        description: Date the sign-up completed.
        tests:
          - not_null
      - name: attribution_source
        description: Modelled marketing attribution source for the sign-up.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Organic', 'Paid']
      - name: billing_period
        description: Billing plan of the term purchased at sign-up, Unknown when missing upstream.
        tests:
          - not_null
      - name: geo_id
        description: Surrogate key for the country and region combination.
        tests:
          - not_null
      - name: geo_country
        description: Country where the sign-up occurred.
        tests:
          - not_null
      - name: geo_region
        description: Region or state where the sign-up occurred.
      - name: device_platform_id
        description: Surrogate key for the device platform (dim_device_platform).
      - name: platform
        description: Reporting platform the sign-up came from (iOS App, Android App, Mobile Web, Desktop Web, ...).
      - name: app_type
        description: Platform family (Web or Mobile App) the sign-up came from.
      - name: device_type
        description: Device category the sign-up came from.
      - name: os_group
        description: Operating system group the sign-up came from.
      - name: n_signups
        description: Fractionally attributed sign-ups for the row; additive across all dimensions and dates.
        tests:
          - not_null

  - name: agg_acquisition_funnel_daily
    description: >
      Daily acquisition funnel metrics stored as HyperLogLog sketches so distinct visitor
      counts can be re-aggregated across any date range or dimension filter without
      revisiting the event-level tables. Two row families share the table: 'exposures'
      rows (per template type) carry the exposed-visitor sketch and exact conversion
      counts; 'page_displays' rows carry the page-display visitor sketch that serves as
      the exposure-rate denominator, replicated under every template_type so the
      denominator survives template cuts (merging identical HLL sketches is exact, so
      un-cut totals are unaffected). Tableau must use a
      live connection and pass-through aggregates, e.g.
      RAWSQLAGG_INT("HLL_ESTIMATE(HLL_COMBINE(%1))", [exposed_visitors_hll]);
      estimates carry roughly 1.6% relative error. Note that page-display rows cover
      US/Canada only (fct_visitors_daily filter, country literal 'United states'),
      so exposure rates are only valid when filtered to those countries; conversion
      rates are valid worldwide.
    columns:
      - name: funnel_day_key
        description: Surrogate key for the date, record source, template type and dimension combination.
        tests:
          - not_null
          - unique
      - name: record_source
        description: Row family discriminator separating exposure rows from page-display denominator rows.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['exposures', 'page_displays']
      - name: date_day
        description: Activity date for the sketches and counts.
        tests:
          - not_null
      - name: template_type
        description: >
          Composer template family shown to the visitor. Page-display denominator rows
          are replicated under every template type so template filters keep their denominator.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Paywall', 'Ribbon', 'Subscription Landing Page', 'Other']
      - name: device_platform_id
        description: Surrogate key for the device platform (dim_device_platform).
      - name: platform
        description: Reporting platform for the row (iOS App, Android App, Mobile Web, Desktop Web, ...).
      - name: app_type
        description: Platform family (Web or Mobile App) for the row.
      - name: device_type
        description: Device category for the row.
      - name: os_group
        description: Operating system group for the row.
      - name: geo_country
        description: Country for the row, Unknown when missing upstream.
        tests:
          - not_null
      - name: exposed_visitors_hll
        description: HyperLogLog state of distinct visitors exposed to the template; combine with HLL_COMBINE before estimating. Null on page-display rows.
      - name: n_exposed_visitors
        description: Exact distinct exposed visitors for this row only; non-additive, for validation - never SUM in Tableau.
      - name: page_visitors_hll
        description: >
          HyperLogLog state of distinct page-display visitors (exposure-rate denominator,
          US/Canada only). Null on exposure rows; identical copy on each template_type
          replica of a cell, so HLL_COMBINE across templates is exact.
        tests:
          - not_null:
              config:
                where: "record_source = 'page_displays'"
      - name: n_conversions
        description: Exact distinct conversions attributed to the template for the row; additive.
        tests:
          - not_null:
              config:
                where: "record_source = 'exposures'"

  - name: agg_engaged_subscribers_monthly
    description: Monthly aggregate of active and engaged subscribers.
    columns:
      - name: month_start_date
        description: First day of the reporting month.
        tests:
          - not_null
          - unique
      - name: active_subscribers
        description: Count of distinct active subscribers in the month.
        tests:
          - not_null
      - name: engaged_subscribers
        description: Count of distinct engaged subscribers in the month.
        tests:
          - not_null
      - name: engaged_subscriber_rate
        description: Engaged subscribers as a percentage of active subscribers.
        tests:
          - not_null

  - name: agg_engaged_subscribers_weekly
    description: Weekly aggregate of active and engaged subscribers.
    columns:
      - name: week_start_date
        description: First day of the reporting week.
        tests:
          - not_null
          - unique
      - name: active_subscribers
        description: Count of distinct active subscribers in the week.
        tests:
          - not_null
      - name: engaged_subscribers
        description: Count of distinct engaged subscribers in the week.
        tests:
          - not_null
      - name: engaged_subscriber_rate
        description: Engaged subscribers as a percentage of active subscribers.
        tests:
          - not_null

  - name: agg_subs_content_1w_snapshot
    description: One-week snapshot of subscriber content engagement.
    columns:
      - name: content_id
        description: Identifier for the content being engaged with.
        tests:
          - not_null
      - name: content_pillar
        description: The pillar to which the content belongs.
        tests:
          - not_null
      - name: page_title
        description: The title of the page containing the content.
        tests:
          - not_null
      - name: subscribers_viewed
        description: Count of distinct subscribers who have viewed the content.
        tests:
          - not_null
      - name: article_views
        description: Count of distinct articles viewed by subscribers.
        tests:
          - not_null

  - name: agg_subs_pillar_views_l30d_snapshot
    description: 30-day snapshot of pillar-level subscriber views.
    columns:
      - name: category
        description: The category of the content.
      - name: page_views
        description: Count of pages viewed by subscribers.
        tests:
          - not_null

  - name: agg_subs_product_usage_30d_snapshot
    description: 30-day snapshot of product usage metrics for subscribers.
    columns:
      - name: product
        description: The product for which usage metrics are being tracked.
        tests:
          - not_null
      - name: current_pct
        description: The current percentage of product usage.
        tests:
          - not_null
      - name: prior_pct
        description: The prior percentage of product usage.
        tests:
          - not_null
      - name: mom
        description: The month-over-month change in product usage.
        tests:
          - not_null

  - name: agg_subscription_attribution_touchpoint
    description: >
      The click-based subscription attribution, flat, for the Subscriptions Click Based Attribution
      dashboard. One row per attributable web subscription x credited touchpoint (the grain of
      fct_attribution_touchpoints): every touch, its four credits and every label it is filtered or
      grouped by. No weight is recalculated; left joins, so no touch is dropped. Text is capped at
      VARCHAR(512) for Tableau's Snowflake driver.
    columns:
      - name: attribution_touchpoint_sk
        description: Primary key (the fact's).
        tests:
          - not_null
          - unique
      - name: conversion_id
        description: The subscription purchase; count distinct for subscriptions.
        tests:
          - not_null
      - name: touchpoint_date
        description: Date of the touch - the date the dashboard reports by.
        tests:
          - not_null
      - name: is_paid_touch
        description: TRUE for an 8MS / DBS paid-media touch.
        tests:
          - not_null
      - name: funnel_stage
        description: TOF / MOF / BOF from the ad platform's campaign name; NULL for touches without a known Meta ad (the Google upload has no campaign).
      - name: position_weight
        description: Position-based credit, the dashboard's model; sums to 1 per conversion.
        tests:
          - not_null
    tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('fct_attribution_touchpoints')

  - name: agg_marketing_paid_page_views
    description: >
      Paid page views with the spend that bought them, for the Marketing Measurement Dashboard's
      Overview and Stage deep dive. One row per paid page view that spend can reach, plus one row per
      spend day with no page views. Meta spend is matched to page views by ad and day; Google and
      Microsoft spend by campaign and day (Piano's src_campaign), as Piano rarely carries their ad ids
      and Performance Max has none. spend_key says which. The day's spend, impressions and clicks are
      split equally across its page views (spend_per_page_view and its twins are additive; spend and
      the other day totals are not). Podcast ads are left out unless var include_podcast_ads. Column
      names follow the dashboard.
    columns:
      - name: pageview_id
        description: The paid page view; NULL on spend-only days.
        tests:
          - unique
      - name: date_day
        description: Day of the page view, or of the spend day when it had none.
        tests:
          - not_null
      - name: spend_key
        description: >
          What spend was matched on: the Meta ad id, or 'campaign:' plus the lower-cased campaign name
          for Google and Microsoft.
        tests:
          - not_null
      - name: lts_band
        description: >
          The page view's LTS (likelihood to subscribe) tier: 90+, 70-89, 40-69, 20-39, 0-19, or 'No score';
          NULL on spend-only days.
        tests:
          - accepted_values:
              arguments:
                values: ["LTS 90+", "LTS 70-89", "LTS 40-69", "LTS 20-39", "LTS 0-19", "No score"]

  - name: agg_marketing_visitor_funnel
    description: >
      The paid visitor funnel for the Marketing Measurement Dashboard's Funnel tab. One row per paid
      visitor x campaign (fct_paid_visitor_funnel) with the labels the dashboard filters by. date_day
      is the visitor's first arrival on the campaign. Column names follow the dashboard.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - visitor_id
              - src_campaign
    columns:
      - name: revops_band
        description: RevOps band of the visitor's highest RevOps score over their paid page views.
      - name: lts_band
        description: >
          LTS (likelihood to subscribe) tier of the visitor's highest LTS score over their paid page views,
          like revops_band. ro_first_lower_bound_visitor and lts_first_lower_bound_visitor hold the scores on
          arrival, before the visit moves them.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["LTS 90+", "LTS 70-89", "LTS 40-69", "LTS 20-39", "LTS 0-19", "No score"]

  - name: agg_marketing_stage_funnel
    description: >
      The paid visitor funnel by stage, counted as the Marketing Measurement Dashboard's Funnel tab counts
      it, for the visitor funnel in sv_marketing. One row per paid visitor and funnel stage (TOF, MOF, BOF,
      BOF (Docs)) from agg_marketing_visitor_funnel, dated on the visitor's first day in that stage, plus one
      row per visitor for 'All stages', dated on their first paid day. A flag is 1 when any of the visitor's
      campaigns in the stage has it. Totals across stages come from the 'All stages' rows, never from adding
      the stage rows.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - funnel_stage
              - visitor_id
    columns:
      - name: funnel_stage
        description: TOF, MOF, BOF, BOF (Docs), or All stages (each visitor once across the four stages).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["TOF", "MOF", "BOF", "BOF (Docs)", "All stages"]
      - name: visitor_id
        description: Piano visitor id as hex text.
        tests:
          - not_null
      - name: date_day
        description: The visitor's first day in the stage; their first paid day for All stages.
        tests:
          - not_null
      - name: src_bbc_team
        description: Agency of the visitor's first campaign in the stage.
      - name: lts_band_on_arrival
        description: >
          LTS band on the visitor's first scored paid page view, before the visit moves it; the dashboard's
          default band.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["LTS 90+", "LTS 70-89", "LTS 40-69", "LTS 20-39", "LTS 0-19", "No score"]
      - name: revops_band_on_arrival
        description: RevOps band on the visitor's first scored paid page view.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["RevOps 90+", "RevOps 80-89", "RevOps 50-79", "RevOps under 50", "No score"]
      - name: lts_band_best
        description: LTS band of the visitor's highest LTS score over their paid page views.
      - name: revops_band_best
        description: RevOps band of the visitor's highest RevOps score over their paid page views.

  - name: agg_marketing_campaign_daily
    description: >
      Campaign economics by day for the Marketing Measurement Dashboard's Campaign deep dive. One row
      per platform x src_campaign x funnel stage x agency x day, combining delivery and spend
      (agg_marketing_paid_page_views), visitor outcomes (agg_marketing_visitor_funnel) and the
      click-based attribution's paid credit (fct_attribution_touchpoints), each additive by day, so
      every ratio is SUM / SUM. platform comes from the campaign's spend (meta, google or microsoft),
      and is meta for campaigns with no spend.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - platform
              - date_day
              - src_campaign
              - funnel_stage
              - funnel_stage_v2
              - src_bbc_team

  - name: agg_newsletter_activity
    description: >
      The newsletter acquisition dashboard's source: one row per visit to the newsletters page (event_name
      'page.display') plus one row per sign-up x newsletter, latest per visitor and newsletter (event_name
      'newsletter.subscribe'), the two row types the dashboard's calculations expect. Total page views are the
      page.display rows, sign-ups the newsletter.subscribe rows, distinct sign-ups the distinct visitor_id on those
      rows. Ids are hex text. Replaces reporting_newsletter_activity from the old project, with history from
      var newsletter_start_date and is_suspected_automated added.
    columns:
      - name: event_name
        description: page.display (a visit) or newsletter.subscribe (a sign-up to one newsletter).
        tests:
          - accepted_values:
              arguments:
                values: ["page.display", "newsletter.subscribe"]
      - name: event_day
        description: Day of the visit's latest display, or of the sign-up.
        tests:
          - not_null
      - name: visitor_id
        description: Piano visitor id as hex text.
        tests:
          - not_null
      - name: newsletter_title
        description: The newsletter signed up to; NULL on page.display rows.
      - name: link_origin
        description: Placement tag (at_link_origin) from the visit's latest display.
      - name: account_status
        description: Signed in, Account, not signed in, or Not identified (see fct_newsletter_page_visits).
        tests:
          - accepted_values:
              arguments:
                values: ["Signed in", "Account, not signed in", "Not identified"]
      - name: is_suspected_automated
        description: TRUE for visits (and their sign-ups) with more than var newsletter_automated_display_limit displays of the page.
