name: Run DBT Task
description: >
  Full DBT job on dbt Fusion - sets up profile, installs deps, validates, and runs a DBT command.
  Mirrors bbc/sdp-deployment-scripts/actions/run-dbt-task, which installs dbt-core instead.

inputs:
  snowflake_account:
    description: Snowflake account identifier
    required: true
  snowflake_machine_user:
    description: Snowflake machine username
    required: true
  snowflake_private_key_base64:
    description: Base64-encoded Snowflake private key
    required: true
  snowflake_private_key_passphrase:
    description: Passphrase for the private key
    required: true
  snowflake_role:
    description: Snowflake role
    required: true
  snowflake_database:
    description: Snowflake database
    required: true
  snowflake_warehouse:
    description: Snowflake warehouse
    required: true
  snowflake_schema:
    description: Snowflake schema
    required: true
  dbt_args:
    description: Arguments passed to the `dbt` command (e.g. `run --select hello_world`)
    required: true
  dbt_target:
    description: Name of the generated profile target, matching the local target names (`dev` or `live`) so macros that read `target.name` behave the same in CI
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up DBT profile for Snowflake
      shell: bash
      env:
        SNOWFLAKE_ACCOUNT: ${{ inputs.snowflake_account }}
        SNOWFLAKE_USER: ${{ inputs.snowflake_machine_user }}
        SNOWFLAKE_PRIVATE_KEY_BASE64: ${{ inputs.snowflake_private_key_base64 }}
        SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ inputs.snowflake_private_key_passphrase }}
        SNOWFLAKE_ROLE: ${{ inputs.snowflake_role }}
        SNOWFLAKE_DATABASE: ${{ inputs.snowflake_database }}
        SNOWFLAKE_SCHEMA: ${{ inputs.snowflake_schema }}
        SNOWFLAKE_WAREHOUSE: ${{ inputs.snowflake_warehouse }}
        DBT_TARGET: ${{ inputs.dbt_target }}
      run: |
        case "$DBT_TARGET" in dev|live) ;; *) echo "dbt_target must be dev or live, got: $DBT_TARGET" >&2; exit 1 ;; esac
        mkdir -p ~/.dbt
        echo "$SNOWFLAKE_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/snowflake.p8"
        cat > ~/.dbt/profiles.yml <<EOF
        snowflake:
          target: "$DBT_TARGET"
          outputs:
            "$DBT_TARGET":
              type: snowflake
              account: "$SNOWFLAKE_ACCOUNT"
              user: "$SNOWFLAKE_USER"
              private_key_path: "$RUNNER_TEMP/snowflake.p8"
              private_key_passphrase: "$SNOWFLAKE_PRIVATE_KEY_PASSPHRASE"
              role: "$SNOWFLAKE_ROLE"
              database: "$SNOWFLAKE_DATABASE"
              schema: "$SNOWFLAKE_SCHEMA"
              warehouse: "$SNOWFLAKE_WAREHOUSE"
              threads: 1
              client_session_keep_alive: False
        EOF

    - name: Install dbt Fusion
      uses: ./.github/actions/install-dbt-fusion

    - name: Install DBT dependencies
      shell: bash
      run: dbt deps

    - name: Validate DBT project
      shell: bash
      run: |
        echo "Parsing DBT project..."
        dbt parse
        echo "Validating DBT connection with dbt debug..."
        dbt debug

    - name: Run DBT Task
      shell: bash
      env:
        DBT_ARGS: ${{ inputs.dbt_args }}
      run: |
        echo "Running dbt $DBT_ARGS"
        dbt $DBT_ARGS
