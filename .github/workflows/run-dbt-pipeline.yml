name: Run DBT Pipeline

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Environment
        options:
          - live
        default: live
        required: true
      full_refresh:
        type: boolean
        description: Run with --full-refresh flag
        default: false
        required: true
      skip_extract_load:
        type: boolean
        description: Skip the cgm-extract-load step and only run dbt
        default: false
        required: true

jobs:
  run_dbt_pipeline:
    name: Run DBT Pipeline
    runs-on:
      - codebuild-dns-transformations-project-${{ github.run_id }}-${{ github.run_attempt }}
    environment: ${{ inputs.environment || 'live' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Loads raw source tables (e.g. Piano subscriptions) into DNS_TRANSFORMATIONS.
      # Checked out after this repo, whose checkout would otherwise clean it away.
      - name: Checkout cgm-extract-load
        if: ${{ !inputs.skip_extract_load }}
        uses: actions/checkout@v4
        with:
          repository: bbc/cgm-extract-load
          path: cgm-extract-load
          ssh-key: ${{ secrets.CGM_EXTRACT_LOAD_DEPLOY_KEY }}

      # A failed load still lets dbt run on the previous day's raw data; it
      # sends its own failure notification below.
      - name: Run Extract Load
        id: extract_load
        if: ${{ !inputs.skip_extract_load }}
        continue-on-error: true
        uses: ./cgm-extract-load/.github/actions/run-extract-load
        with:
          target: prod
          snowflake_account: ${{ vars.SNOWFLAKE_ACCOUNT }}
          snowflake_machine_user: ${{ vars.SNOWFLAKE_MACHINE_USER }}
          snowflake_role: ${{ vars.SNOWFLAKE_ROLE }}
          snowflake_private_key_base64: ${{ secrets.SNOWFLAKE_CERT }}
          snowflake_private_key_passphrase: ${{ secrets.SNOWFLAKE_CERT_PASS }}
          snowflake_database: ${{ vars.SNOWFLAKE_DATABASE }}
          snowflake_schema: ${{ vars.SNOWFLAKE_SCHEMA }}
          snowflake_warehouse: ${{ vars.SNOWFLAKE_WAREHOUSE }}
          piano_aid: ${{ secrets.PIANO_AID }}
          piano_api_token: ${{ secrets.PIANO_API_TOKEN }}

      - name: Trigger Extract Load Failure Notification
        uses: bbc/sdp-deployment-scripts/actions/trigger-notification@main
        if: ${{ !cancelled() && steps.extract_load.outcome == 'failure' }}
        with:
          TYPE: "transformation-executed"
          ENVIRONMENT: ${{ inputs.environment || 'live' }}
          SERVICE_NAME: "dns-transformations-project-transformations"
          TRANSFORMATION_NAME: "extract load (cgm-extract-load)"
          TRIGGERED_BY_USERNAME: ${{ github.actor }}
          STATUS: "failure"
          DEPLOYMENTS_API_KEY: ${{ secrets.DEPLOYMENTS_API_KEY }}

      - name: Run DBT Task
        uses: ./.github/actions/run-dbt-task
        with:
          snowflake_account: ${{ vars.SNOWFLAKE_ACCOUNT }}
          snowflake_machine_user: ${{ vars.SNOWFLAKE_MACHINE_USER }}
          snowflake_role: ${{ vars.SNOWFLAKE_ROLE }}
          snowflake_private_key_base64: ${{ secrets.SNOWFLAKE_CERT }}
          snowflake_private_key_passphrase: ${{ secrets.SNOWFLAKE_CERT_PASS }}
          snowflake_database: ${{ vars.SNOWFLAKE_DATABASE }}
          snowflake_schema: ${{ vars.SNOWFLAKE_SCHEMA }}
          snowflake_warehouse: ${{ vars.SNOWFLAKE_WAREHOUSE }}
          dbt_args: run ${{ inputs.full_refresh && '--full-refresh' || '' }}

      - name: Run DBT Tests
        id: dbt_tests
        uses: ./.github/actions/run-dbt-task
        with:
          snowflake_account: ${{ vars.SNOWFLAKE_ACCOUNT }}
          snowflake_machine_user: ${{ vars.SNOWFLAKE_MACHINE_USER }}
          snowflake_role: ${{ vars.SNOWFLAKE_ROLE }}
          snowflake_private_key_base64: ${{ secrets.SNOWFLAKE_CERT }}
          snowflake_private_key_passphrase: ${{ secrets.SNOWFLAKE_CERT_PASS }}
          snowflake_database: ${{ vars.SNOWFLAKE_DATABASE }}
          snowflake_schema: ${{ vars.SNOWFLAKE_SCHEMA }}
          snowflake_warehouse: ${{ vars.SNOWFLAKE_WAREHOUSE }}
          dbt_args: test

      - name: Trigger Test Failure Notification
        uses: bbc/sdp-deployment-scripts/actions/trigger-notification@main
        if: failure() && steps.dbt_tests.conclusion == 'failure'
        with:
          TYPE: "transformation-executed"
          ENVIRONMENT: ${{ inputs.environment || 'live' }}
          SERVICE_NAME: "dns-transformations-project-transformations"
          TRANSFORMATION_NAME: "${{ (inputs.full_refresh == true) && 'full DAG tests (full-refresh)' || 'full DAG tests' }}"
          TRIGGERED_BY_USERNAME: ${{ github.actor }}
          STATUS: "failure"
          DEPLOYMENTS_API_KEY: ${{ secrets.DEPLOYMENTS_API_KEY }}

      - name: Trigger Notification
        uses: bbc/sdp-deployment-scripts/actions/trigger-notification@main
        if: always()
        with:
          TYPE: "transformation-executed"
          ENVIRONMENT: ${{ inputs.environment || 'live' }}
          SERVICE_NAME: "dns-transformations-project-transformations"
          TRANSFORMATION_NAME: ${{ (inputs.full_refresh == true) && 'full DAG (full-refresh)' || 'full DAG' }}
          TRIGGERED_BY_USERNAME: ${{ github.actor }}
          STATUS: ${{ job.status }}
          DEPLOYMENTS_API_KEY: ${{ secrets.DEPLOYMENTS_API_KEY }}
