name: Run DBT Pipeline

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Environment
        options:
          - live
        default: live
        required: true
      full_refresh:
        type: boolean
        description: Run with --full-refresh flag
        default: false
        required: true
      skip_extract_load:
        type: boolean
        description: Skip the cgm-extract-load step and only run dbt
        default: false
        required: true

permissions:
  contents: read

# Extract/load, dbt run and dbt test each get their own job because each runner
# is capped at one hour (IT policy) and together they take longer than that.
jobs:
  # Loads raw source tables (e.g. Piano subscriptions) into DNS_TRANSFORMATIONS.
  extract_load:
    name: Run Extract Load
    if: ${{ !inputs.skip_extract_load }}
    runs-on:
      - codebuild-dns-transformations-project-${{ github.run_id }}-${{ github.run_attempt }}
    environment: ${{ inputs.environment || 'live' }}
    steps:
      - name: Checkout cgm-extract-load
        uses: actions/checkout@v4
        with:
          repository: bbc/cgm-extract-load
          path: cgm-extract-load
          ssh-key: ${{ secrets.CGM_EXTRACT_LOAD_DEPLOY_KEY }}

      # A failed load still lets dbt run on the previous day's raw data; it
      # sends its own failure notification below.
      - name: Run Extract Load
        id: extract_load
        continue-on-error: true
        uses: ./cgm-extract-load/.github/actions/run-extract-load
        with:
          target: prod
          snowflake_account: ${{ vars.SNOWFLAKE_ACCOUNT }}
          snowflake_machine_user: ${{ vars.SNOWFLAKE_MACHINE_USER }}
          snowflake_role: ${{ vars.SNOWFLAKE_ROLE }}
          snowflake_private_key_base64: ${{ secrets.SNOWFLAKE_CERT }}
          snowflake_private_key_passphrase: ${{ secrets.SNOWFLAKE_CERT_PASS }}
          snowflake_database: ${{ vars.SNOWFLAKE_DATABASE }}
          snowflake_schema: ${{ vars.SNOWFLAKE_SCHEMA }}
          snowflake_warehouse: ${{ vars.SNOWFLAKE_WAREHOUSE }}
          piano_aid: ${{ secrets.PIANO_AID }}
          piano_api_token: ${{ secrets.PIANO_API_TOKEN }}

      - name: Trigger Extract Load Failure Notification
        uses: bbc/sdp-deployment-scripts/actions/trigger-notification@main
        if: ${{ !cancelled() && steps.extract_load.outcome == 'failure' }}
        with:
          TYPE: "transformation-executed"
          ENVIRONMENT: ${{ inputs.environment || 'live' }}
          SERVICE_NAME: "dns-transformations-project-transformations"
          TRANSFORMATION_NAME: "extract load (cgm-extract-load)"
          TRIGGERED_BY_USERNAME: ${{ github.actor }}
          STATUS: "failure"
          DEPLOYMENTS_API_KEY: ${{ secrets.DEPLOYMENTS_API_KEY }}

  run_dbt_pipeline:
    name: Run DBT Pipeline
    needs: extract_load
    # Runs whether the extract/load job succeeded, failed or was skipped; the
    # freshness check below guards against building on stale data.
    if: ${{ !cancelled() }}
    runs-on:
      - codebuild-dns-transformations-project-${{ github.run_id }}-${{ github.run_attempt }}
    environment: ${{ inputs.environment || 'live' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Stops the run if the raw sources the extract/load fills are more than
      # 26 hours old (i.e. it has missed two nights), rather than building on
      # stale data. One missed night only warns.
      - name: Check Source Freshness
        uses: ./.github/actions/run-dbt-task
        with:
          snowflake_account: ${{ vars.SNOWFLAKE_ACCOUNT }}
          snowflake_machine_user: ${{ vars.SNOWFLAKE_MACHINE_USER }}
          snowflake_role: ${{ vars.SNOWFLAKE_ROLE }}
          snowflake_private_key_base64: ${{ secrets.SNOWFLAKE_CERT }}
          snowflake_private_key_passphrase: ${{ secrets.SNOWFLAKE_CERT_PASS }}
          snowflake_database: ${{ vars.SNOWFLAKE_DATABASE }}
          snowflake_schema: ${{ vars.SNOWFLAKE_SCHEMA }}
          snowflake_warehouse: ${{ vars.SNOWFLAKE_WAREHOUSE }}
          dbt_args: source freshness --select source:cgm_extract_load.raw_piano_subscription_snapshots
          dbt_target: live

      - name: Run DBT Task
        uses: ./.github/actions/run-dbt-task
        with:
          snowflake_account: ${{ vars.SNOWFLAKE_ACCOUNT }}
          snowflake_machine_user: ${{ vars.SNOWFLAKE_MACHINE_USER }}
          snowflake_role: ${{ vars.SNOWFLAKE_ROLE }}
          snowflake_private_key_base64: ${{ secrets.SNOWFLAKE_CERT }}
          snowflake_private_key_passphrase: ${{ secrets.SNOWFLAKE_CERT_PASS }}
          snowflake_database: ${{ vars.SNOWFLAKE_DATABASE }}
          snowflake_schema: ${{ vars.SNOWFLAKE_SCHEMA }}
          snowflake_warehouse: ${{ vars.SNOWFLAKE_WAREHOUSE }}
          # Semantic views are excluded: only DNS_TRANSFORMATIONS_PROJECT_ANALYST can create them
          # until platform engineering grants CREATE SEMANTIC VIEW to the pipeline role. Deploy them
          # with `dbt run --select tag:semantic_view --target analyst` instead.
          dbt_args: run --exclude tag:semantic_view ${{ inputs.full_refresh && '--full-refresh' || '' }}
          dbt_target: live

  run_dbt_tests:
    name: Run DBT Tests
    needs: run_dbt_pipeline
    # Explicit, because the default success() would also skip this job when
    # the extract/load job failed.
    if: ${{ !cancelled() && needs.run_dbt_pipeline.result == 'success' }}
    runs-on:
      - codebuild-dns-transformations-project-${{ github.run_id }}-${{ github.run_attempt }}
    environment: ${{ inputs.environment || 'live' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run DBT Tests
        id: dbt_tests
        uses: ./.github/actions/run-dbt-task
        with:
          snowflake_account: ${{ vars.SNOWFLAKE_ACCOUNT }}
          snowflake_machine_user: ${{ vars.SNOWFLAKE_MACHINE_USER }}
          snowflake_role: ${{ vars.SNOWFLAKE_ROLE }}
          snowflake_private_key_base64: ${{ secrets.SNOWFLAKE_CERT }}
          snowflake_private_key_passphrase: ${{ secrets.SNOWFLAKE_CERT_PASS }}
          snowflake_database: ${{ vars.SNOWFLAKE_DATABASE }}
          snowflake_schema: ${{ vars.SNOWFLAKE_SCHEMA }}
          snowflake_warehouse: ${{ vars.SNOWFLAKE_WAREHOUSE }}
          dbt_args: test
          dbt_target: live

      - name: Trigger Test Failure Notification
        uses: bbc/sdp-deployment-scripts/actions/trigger-notification@main
        if: failure() && steps.dbt_tests.conclusion == 'failure'
        with:
          TYPE: "transformation-executed"
          ENVIRONMENT: ${{ inputs.environment || 'live' }}
          SERVICE_NAME: "dns-transformations-project-transformations"
          TRANSFORMATION_NAME: "${{ (inputs.full_refresh == true) && 'full DAG tests (full-refresh)' || 'full DAG tests' }}"
          TRIGGERED_BY_USERNAME: ${{ github.actor }}
          STATUS: "failure"
          DEPLOYMENTS_API_KEY: ${{ secrets.DEPLOYMENTS_API_KEY }}

  # Sends the overall result from its own short job, so it still goes out when
  # an earlier job dies outright (e.g. hitting the runner timeout).
  notify:
    name: Notify
    needs: [extract_load, run_dbt_pipeline, run_dbt_tests]
    if: always()
    runs-on:
      - codebuild-dns-transformations-project-${{ github.run_id }}-${{ github.run_attempt }}
    environment: ${{ inputs.environment || 'live' }}
    steps:
      # The extract/load job notifies its own step failures. This covers the
      # job dying outright, when it can't.
      - name: Trigger Extract Load Job Failure Notification
        uses: bbc/sdp-deployment-scripts/actions/trigger-notification@main
        if: ${{ needs.extract_load.result == 'failure' }}
        with:
          TYPE: "transformation-executed"
          ENVIRONMENT: ${{ inputs.environment || 'live' }}
          SERVICE_NAME: "dns-transformations-project-transformations"
          TRANSFORMATION_NAME: "extract load (cgm-extract-load)"
          TRIGGERED_BY_USERNAME: ${{ github.actor }}
          STATUS: "failure"
          DEPLOYMENTS_API_KEY: ${{ secrets.DEPLOYMENTS_API_KEY }}

      - name: Trigger Notification
        uses: bbc/sdp-deployment-scripts/actions/trigger-notification@main
        with:
          TYPE: "transformation-executed"
          ENVIRONMENT: ${{ inputs.environment || 'live' }}
          SERVICE_NAME: "dns-transformations-project-transformations"
          TRANSFORMATION_NAME: ${{ (inputs.full_refresh == true) && 'full DAG (full-refresh)' || 'full DAG' }}
          TRIGGERED_BY_USERNAME: ${{ github.actor }}
          STATUS: ${{ (needs.run_dbt_pipeline.result == 'success' && needs.run_dbt_tests.result == 'success') && 'success' || (contains(needs.*.result, 'cancelled') && 'cancelled' || 'failure') }}
          DEPLOYMENTS_API_KEY: ${{ secrets.DEPLOYMENTS_API_KEY }}
