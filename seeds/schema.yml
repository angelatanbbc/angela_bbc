version: 2

seeds:
  - name: geo_mapping
    description: Geography reference data.
  - name: piano_retention_curves
    description: Expected retention curves for survival-analysis benchmarking.
  - name: app_store_term_billing_period
    description: >
      Billing period of each app store (external) Piano term. Piano holds no billing plan for these terms, because the
      App Store and Google Play bill them, so dim_term takes their billing period from here. term_name is for reference
      only. Add a row whenever a new app store term is created; dim_term's billing_period test fails until you do.
    columns:
      - name: term_id
        tests:
          - not_null
          - unique
      - name: billing_period
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["1 month", "1 year"]
  - name: term_subscription_weight
    description: >
      Number of subscriptions a multi-seat Piano term counts as: 2 for group plans, 10 for Business 10 and 25 for
      Business 25. Terms not listed here count as 1. dim_term takes subscription_weight from here. term_name is for
      reference only. Add a row whenever a new group or business term is created; dim_term warns until you do.
    columns:
      - name: term_id
        tests:
          - not_null
          - unique
      - name: subscription_weight
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [2, 10, 25]
  - name: excluded_promo_codes
    description: >
      Promo codes whose purchases are never attributed (staff, editorial, internal).
      Shared with the dns_dbt_enablement project in the live schema; keep the two identical.
    columns:
      - name: promo_code
        tests:
          - not_null
          - unique
  - name: subscription_sites
    description: >
      Piano sites whose purchases and page views the subscription attribution counts.
      Shared with the dns_dbt_enablement project in the live schema; keep the two identical.
    columns:
      - name: site_id
        tests:
          - not_null
          - unique
  - name: bbc_team_agencies
    description: >
      Piano team codes (src_bbc_team / at_bbc_team, lower-cased) and whether each is a paid-media
      agency. The one agency rule for the attribution, dim_channel and dim_ad; a team not listed is
      not paid. Shared with the dns_dbt_enablement project in the live schema; keep the two identical.
    columns:
      - name: bbc_team_raw
        tests:
          - not_null
          - unique
      - name: is_paid_media
        tests:
          - not_null
  - name: traffic_source_channels
    description: >
      The attribution dashboard's grouping of attribution sources (dim_channel.channel_group); a
      source not listed is its own group. Shared with the dns_dbt_enablement project in the live
      schema; keep the two identical.
    columns:
      - name: attribution_source
        tests:
          - not_null
          - unique
      - name: channel_group
        tests:
          - not_null
  - name: meta_ads_accounts
    description: >
      The Meta ad accounts in scope: account_purpose for dim_ad, and default_bbc_team as the last
      fallback for an ad's team. Shared with the dns_dbt_enablement project in the live schema; keep
      the two identical.
    columns:
      - name: account_id
        tests:
          - not_null
          - unique
      - name: account_purpose
        tests:
          - accepted_values:
              arguments:
                values: ["subscriptions", "app_installs", "other"]
  - name: template_type_override
    description: >
      Template type of Piano offer templates whose name does not classify them correctly, such as paywalls without
      "gate" in the name. dim_template takes template_type from here before falling back to the name rules.
      template_name is for reference only. Add a row whenever a new template is misclassified.
    columns:
      - name: template_id
        tests:
          - not_null
          - unique
      - name: template_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Paywall", "Ribbon", "Subscription Landing Page", "Other"]
