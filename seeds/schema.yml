version: 2

seeds:
  - name: experience_app_type
    description: Maps mobile app experience IDs and names to app types.
    columns:
      - name: experience_id
        tests:
          - not_null
          - unique
      - name: app_type
        tests:
          - not_null
  - name: geo_mapping
    description: Geography reference data.
  - name: piano_retention_curves
    description: Expected retention curves for survival-analysis benchmarking.
